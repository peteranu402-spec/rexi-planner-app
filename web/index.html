/* ---------- account: sign up, log in, backup & sync (Firebase REST, no SDK) ---------- */
const AUTH_KEY='rexi-auth';
let AUTH=(()=>{try{return JSON.parse(localStorage.getItem(AUTH_KEY))||null;}catch(e){return null;}})();
let AV={screen:'start',busy:false,err:'',msg:'',name:'',email:'',show:false};
let syncT=null,syncing=false,CLOUD_DOC=null;
function authOn(){return !!FB.apiKey&&!ALARM_MODE&&(IS_APP||!!FB.test);}
function needAuth(){return authOn()&&!AUTH;}
function saveAuth(){try{if(AUTH)localStorage.setItem(AUTH_KEY,JSON.stringify(AUTH));else localStorage.removeItem(AUTH_KEY);}catch(e){}}

/* HTTP: the app goes through native code (no CORS issues from file://); browsers use fetch. */
const HTTP_WAIT={};let httpSeq=0;
window.__onHttp=function(id,status,body){const r=HTTP_WAIT[id];if(!r)return;delete HTTP_WAIT[id];r({status,body});};
function http(method,url,body,headers){
  headers=headers||{};
  if(IS_APP&&window.AndroidAlarm.http){
    return new Promise(res=>{const id='h'+(++httpSeq);HTTP_WAIT[id]=res;
      setTimeout(()=>{if(HTTP_WAIT[id]){delete HTTP_WAIT[id];res({status:0,body:''});}},30000);
      try{window.AndroidAlarm.http(id,method,url,JSON.stringify(headers),body==null?'':body);}catch(e){delete HTTP_WAIT[id];res({status:0,body:''});}});
  }
  return fetch(url,{method,headers,body:body==null?undefined:body}).then(r=>r.text().then(t=>({status:r.status,body:t}))).catch(()=>({status:0,body:''}));
}
async function api(method,url,obj,token){
  const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;
  const r=await http(method,url,obj==null?null:JSON.stringify(obj),h);
  let j={};try{j=r.body?JSON.parse(r.body):{};}catch(e){}
  if(r.status>=200&&r.status<300)return j;
  const code=r.status===0?'NETWORK':((j.error&&j.error.message)||('HTTP_'+r.status));
  const err=new Error(code);err.status=r.status;throw err;
}
const IDT=m=>'https://identitytoolkit.googleapis.com/v1/accounts:'+m+'?key='+FB.apiKey;
function authErr(e){
  const c=String(e&&e.message||'').split(' ')[0].split(':')[0];
  return ({NETWORK:'No internet connection. Check your data or Wi-Fi and try again.',EMAIL_EXISTS:'An account with this email already exists. Try logging in.',EMAIL_NOT_FOUND:'Wrong email or password.',INVALID_PASSWORD:'Wrong email or password.',INVALID_LOGIN_CREDENTIALS:'Wrong email or password.',INVALID_EMAIL:'That email address doesn’t look right.',MISSING_PASSWORD:'Enter your password.',WEAK_PASSWORD:'Use at least 6 characters for your password.',USER_DISABLED:'This account has been turned off.',TOO_MANY_ATTEMPTS_TRY_LATER:'Too many tries. Wait a few minutes and try again.',OPERATION_NOT_ALLOWED:'This sign-in method isn’t turned on yet.',CREDENTIAL_TOO_OLD_LOGIN_AGAIN:'For your safety, log out and log in again first.'})[c]||'Something went wrong. Please try again.';
}
function setSession(r,extra){
  AUTH=Object.assign(AUTH||{},{uid:r.localId,email:r.email||(AUTH&&AUTH.email)||'',idToken:r.idToken,refreshToken:r.refreshToken,exp:Date.now()+(Number(r.expiresIn)||3600)*1000},extra||{});
  saveAuth();
}
async function token(){
  if(!AUTH)throw new Error('SIGNED_OUT');
  if(AUTH.idToken&&Date.now()<AUTH.exp-120000)return AUTH.idToken;
  const r=await http('POST','https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,'grant_type=refresh_token&refresh_token='+encodeURIComponent(AUTH.refreshToken),{'Content-Type':'application/x-www-form-urlencoded'});
  let j={};try{j=JSON.parse(r.body||'{}');}catch(e){}
  if(r.status===200&&j.id_token){AUTH.idToken=j.id_token;AUTH.refreshToken=j.refresh_token;AUTH.exp=Date.now()+(Number(j.expires_in)||3600)*1000;saveAuth();return AUTH.idToken;}
  const code=(j.error&&j.error.message)||'';
  if(/TOKEN_EXPIRED|INVALID_REFRESH_TOKEN|USER_NOT_FOUND|USER_DISABLED/.test(code)){AUTH=null;saveAuth();AV={screen:'login',busy:false,err:'Please log in again.',msg:'',name:'',email:'',show:false};render();}
  throw new Error(r.status===0?'NETWORK':(code||'HTTP_'+r.status));
}

/* ---- cloud backup: one Firestore document per user, users/{uid} ---- */
const docUrl=()=>'https://firestore.googleapis.com/v1/projects/'+FB.projectId+'/databases/(default)/documents/users/'+AUTH.uid;
function snapshot(){const o=Object.assign({},S);delete o.activeTab;delete o.selectedDay;delete o.active;delete o.notified;return JSON.stringify(o);}
function hasLocalData(){return (S.wakeAlarms||[]).length>0||(S.courses||[]).some(c=>c.title||c.code)||Object.values(S.tt||{}).some(v=>String(v||'').trim())||(S.sessions||[]).length>0||(S.streakCount||0)>0;}
async function cloudGet(){
  try{const j=await api('GET',docUrl(),null,await token());const f=j.fields||{};return {data:f.data&&f.data.stringValue||'',updated:Number(f.updated&&f.updated.integerValue)||0};}
  catch(e){if(e.status===404)return null;throw e;}
}
async function pushNow(){
  if(!AUTH||AUTH.pending)return false;
  clearTimeout(syncT);syncing=true;
  try{
    const now=Date.now();
    await api('PATCH',docUrl(),{fields:{data:{stringValue:snapshot()},updated:{integerValue:String(now)},email:{stringValue:AUTH.email||''}}},await token());
    AUTH.lastSync=now;saveAuth();syncing=false;
    if(S.activeTab==='settings')refreshAccount();
    return true;
  }catch(e){syncing=false;return false;}
}
function queueSync(){if(!AUTH||AUTH.pending)return;clearTimeout(syncT);syncT=setTimeout(pushNow,5000);}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&syncT&&AUTH)pushNow();});

function applyCloud(data){
  clearTimeout(saveT);clearTimeout(syncT);
  try{const v=JSON.parse(data);if(!v||!v.courses)throw 0;S=Object.assign(defaults(),v);localStorage.setItem(KEY,data);}catch(e){toast('Your saved plan couldn’t be loaded');return;}
  AUTH.pending=false;AUTH.lastSync=Date.now();saveAuth();location.reload();
}
async function afterLogin(isNew){
  AV.busy=false;AV.err='';clearTimeout(syncT);
  if(!isNew){
    let doc=null;
    try{doc=await cloudGet();}catch(e){AUTH.pending=true;AUTH.offline=true;saveAuth();render();toast('Couldn’t reach your account. We’ll try again when you’re online.');return;}
    AUTH.offline=false;
    if(doc&&doc.data){
      if(!hasLocalData()){applyCloud(doc.data);return;}
      if(doc.data!==snapshot()){CLOUD_DOC=doc;AUTH.pending=true;AUTH.cloudAt=doc.updated;saveAuth();render();openSheet({kind:'cloud'});return;}
    }
  }
  AUTH.pending=false;saveAuth();
  render();pushNow();
  if(AV.quiet){AV.quiet=false;toast('Saved to your account');}else toast(isNew?'Account created — your plan saves to your account':'Welcome back'+(callName()?', '+callName():'')+'!');
}

/* ---- sign up / log in actions ---- */
function grab(){const g=id=>{const el=document.getElementById(id);return el?el.value:null;};const n=g('aName'),m=g('aEmail');if(n!=null)AV.name=n;if(m!=null)AV.email=m;}
async function authSubmit(){
  if(AV.busy)return;grab();
  const email=AV.email.trim(),pass=(document.getElementById('aPass')||{}).value||'',name=AV.name.trim();
  AV.err='';AV.msg='';
  if(AV.screen==='signup'&&!name){AV.err='Enter your first name.';return renderAuth();}
  if(!/^\S+@\S+\.\S+$/.test(email)){AV.err='Enter a valid email address.';return renderAuth();}
  if(AV.screen!=='forgot'&&pass.length<6){AV.err=AV.screen==='signup'?'Use at least 6 characters for your password.':'Enter your password.';return renderAuth();}
  AV.busy=true;renderAuth();
  try{
    if(AV.screen==='forgot'){
      await api('POST',IDT('sendOobCode'),{requestType:'PASSWORD_RESET',email});
      AV.busy=false;AV.msg='Check your email for a link to reset your password. Look in spam too.';return renderAuth();
    }
    if(AV.screen==='signup'){
      const r=await api('POST',IDT('signUp'),{email,password:pass,returnSecureToken:true});
      setSession(r,{name,provider:'password'});
      api('POST',IDT('update'),{idToken:r.idToken,displayName:name,returnSecureToken:false}).catch(()=>{});
      api('POST',IDT('sendOobCode'),{requestType:'VERIFY_EMAIL',idToken:r.idToken}).catch(()=>{});
      if(!S.name)set({name},false);
      return afterLogin(true);
    }
    const r=await api('POST',IDT('signInWithPassword'),{email,password:pass,returnSecureToken:true});
    setSession(r,{name:r.displayName||'',provider:'password',pending:true});
    if(!S.name&&r.displayName)set({name:r.displayName},false);
    return afterLogin(false);
  }catch(e){AV.busy=false;AV.err=authErr(e);renderAuth();}
}
function authGoogle(){
  if(AV.busy)return;grab();
  if(!(IS_APP&&window.AndroidAlarm.googleSignIn)){AV.err='Google sign-in works in the Android app.';return renderAuth();}
  if(!FB.webClientId){AV.err='Google sign-in isn’t set up yet.';return renderAuth();}
  AV.busy=true;AV.err='';renderAuth();
  try{window.AndroidAlarm.googleSignIn(FB.webClientId);}catch(e){AV.busy=false;AV.err='Couldn’t open Google sign-in.';renderAuth();}
}
window.__onGoogle=async function(idToken){
  try{
    const r=await api('POST',IDT('signInWithIdp'),{postBody:'id_token='+encodeURIComponent(idToken)+'&providerId=google.com',requestUri:'http://localhost',returnSecureToken:true,returnIdpCredential:true});
    const name=r.displayName||r.fullName||r.firstName||'';
    setSession(r,{name,provider:'google',photo:r.photoUrl||'',pending:!r.isNewUser});
    if(!S.name&&name)set({name},false);
    afterLogin(!!r.isNewUser);
  }catch(e){AV.busy=false;AV.err=authErr(e);renderAuth();}
};
window.__onGoogleError=function(code){
  AV.busy=false;
  AV.err=code==='cancel'?'':code==='none'?'No Google account found on this phone. Add one in your phone’s Settings, or use email.':code==='network'?'No internet connection. Check your data or Wi-Fi and try again.':'Google sign-in didn’t work. Try again or use email.';
  renderAuth();
};

async function logout(){
  if(!AUTH)return;
  if(!await ask('Log out of Rexi Rise?','Your plan is backed up and comes back when you log in again. It will be removed from this phone.','Log out'))return;
  const ok=await pushNow();
  if(AUTH&&AUTH.pending){if(!await ask('Your plan isn’t saved yet','This phone’s plan isn’t saved to your account yet. If you log out, it will be removed from this phone.','Log out anyway',true))return;}
  else if(!ok&&!await ask('Couldn’t save your latest changes','No internet? If you log out now, changes since your last save will be lost.','Log out anyway',true))return;
  wipeLocal();
}
async function deleteAccount(){
  if(!AUTH)return;
  if(!await ask('Delete your account?','This permanently deletes your account and your saved plan. It can’t be undone.','Delete',true))return;
  try{
    const t=await token();
    try{await api('DELETE',docUrl(),null,t);}catch(e){if(e.status!==404)throw e;}
    await api('POST',IDT('delete'),{idToken:t});
  }catch(e){toast(authErr(e));return;}
  wipeLocal();
}
function wipeLocal(){
  clearTimeout(syncT);
  const theme=S.theme;
  AUTH=null;saveAuth();
  S=Object.assign(defaults(),{theme,themeChosen:true,onboarded:true});
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  syncNative(); // clears this phone's alarms
  AV={screen:'start',busy:false,err:'',msg:'',name:'',email:'',show:false};
  if(SHEET)closeSheet();
  render();scrollTo(0,0);
}

  const when=AUTH&&AUTH.cloudAt?new Date(AUTH.cloudAt).toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'earlier';
  return {title:'Your saved plan',content:'<div class="cloud-ic">'+svg('cloud',44,1.6)+'</div><p class="sub" style="text-align:center;margin:0 0 16px">We found a plan saved on your account from <b>'+esc(when)+'</b>, and this phone also has a plan.<br>Which one do you want to keep?</p>'
    +'<button class="cloud-opt" data-action="useCloud"><b>Use my saved plan</b><small>Replaces what’s on this phone with your saved plan.</small></button>'
    +'<button class="cloud-opt" data-action="useLocal"><b>Keep this phone’s plan</b><small>Saves this phone’s plan to your account instead.</small></button>',foot:''};
}

async function useCloud(){
  let doc=CLOUD_DOC;
  if(!doc){try{doc=await cloudGet();}catch(e){toast(authErr(e));return;}}
  if(!doc||!doc.data){AUTH.pending=false;saveAuth();closeSheet();pushNow();return;}
  applyCloud(doc.data);
}
function useLocal(){AUTH.pending=false;CLOUD_DOC=null;saveAuth();closeSheet();pushNow().then(ok=>toast(ok?'Backed up this phone’s plan':'Saved — we’ll back up when you’re online'));}
async function syncNow(){
  if(!AUTH)return;
  if(AUTH.pending){toast('Checking your account…');AV.quiet=true;afterLogin(false);return;}
  toast('Backing up…');const ok=await pushNow();toast(ok?'Backed up':'Couldn’t back up. Check your internet.');
}

/* ---- NLT (New Living Translation), fetched from Tyndale's official NLT API and kept on the phone ---- */
const NLT_KEY='TEST',NLT_STORE='rexi-nlt';
let NLT={};try{NLT=JSON.parse(localStorage.getItem(NLT_STORE)||'{}')||{};}catch(e){NLT={};}
const NLT_WAIT={};
function isRef(r){return /^[1-3]?\s?[A-Za-z][A-Za-z ]+\s\d+:\d+/.test(String(r||'').trim());}
function nltFromHtml(html,ref){
  try{
    const d=new DOMParser().parseFromString(String(html||''),'text/html');
    d.querySelectorAll('script,style,h1,h2,h3,h4,h5,h6,sup,.vn,.tn,.a-tn,.subhead,.hd,.body-hd,.bk_ch_vs_header,.chapter-number,.cw').forEach(e=>e.remove());
    let t=(d.body?d.body.textContent:'')||'';
    t=t.replace(/[*\u2020\u2021]/g,'').replace(/\s+/g,' ').trim();
    if(ref)t=t.split(ref+', NLT').join('').split(ref).join('');
    t=t.replace(/^\d+\s*/,'').replace(/\s(\d{1,3})(?=[A-Z\u201C"])/g,' ').replace(/\s+/g,' ').trim();
    return t.length>8&&t.length<900?t:'';
  }catch(e){return '';}
}
function fetchNLT(ref){
  ref=String(ref||'').trim();
  if(!isRef(ref)||NLT[ref])return Promise.resolve(NLT[ref]||'');
  if(NLT_WAIT[ref])return NLT_WAIT[ref];
  return NLT_WAIT[ref]=http('GET','https://api.nlt.to/api/passages?ref='+encodeURIComponent(ref)+'&version=NLT&key='+NLT_KEY).then(r=>{
    delete NLT_WAIT[ref];
    const t=r&&r.status===200?nltFromHtml(r.body,ref):'';
    if(t){NLT[ref]=t;try{localStorage.setItem(NLT_STORE,JSON.stringify(NLT));}catch(e){}}
    return t;
  }).catch(()=>{delete NLT_WAIT[ref];return '';});
}
/* Quietly fill the phone's NLT copy for every verse, a few at a time, so it works offline later. */
async function prefetchNLT(){
  const refs=[...new Set(VERSE_PACKS.flatMap(p=>p.v.map(v=>v[1])).concat((S.myVerses||[]).map(v=>v.ref)).filter(r=>isRef(r)&&!NLT[r]))];
  for(const r of refs){const t=await fetchNLT(r);if(!t&&!navigator.onLine)return;await new Promise(z=>setTimeout(z,1200));}
}
function versePool(cfg){
  const ids=cfg.verses||allVerseIds();let out=[];
  VERSE_PACKS.forEach(p=>{if(ids.includes(p.id))out=out.concat(p.v);});
  if(ids.includes('mine')||!cfg.verses)(S.myVerses||[]).forEach(v=>out.push([v.text,v.ref||'My verse',1]));
  return out.length?out:VERSE_PACKS.reduce((a,p)=>a.concat(p.v),[]);
}
function affirmPool(cfg){const ids=cfg.affirms||AFFIRM_PACKS.map(p=>p.id);let out=[];AFFIRM_PACKS.forEach(p=>{if(ids.includes(p.id))out=out.concat(p.v);});return out.length?out:AFFIRMATIONS;}
function quizPool(cfg){const ids=cfg.topics||QUIZ_TOPICS.map(p=>p.id);let out=[];QUIZ_TOPICS.forEach(p=>{if(ids.includes(p.id))out=out.concat(p.q.map(q=>({q,topic:p.name})));});return out.length?out:QUIZ_TOPICS[0].q.map(q=>({q,topic:QUIZ_TOPICS[0].name}));}

/* ---------- quiet while doing the mission; ring again if you leave ---------- */
let webQuietUntil=0,webQuietT=null,lastQuietPing=0;
const QUIET_SECS=60;
// Rule: the alarm keeps ringing during a mission, except speaking missions (the mic must hear you).
function missionSound(){
  if(!current||!M||M.phase!=='task')return;
  if(M.task&&SPOKEN(M.task.type)){quietMission();return;}
  lastQuietPing=0;webQuietUntil=0;clearTimeout(webQuietT);
  if(IS_APP){try{window.AndroidAlarm.resumeSound&&window.AndroidAlarm.resumeSound();}catch(e){}return;}
  if(!alarmTimer)startWebSound(current);
}
function quietMission(){
  if(!current||!M||!M.task||!SPOKEN(M.task.type))return;
  lastQuietPing=Date.now();
  if(IS_APP){try{window.AndroidAlarm.quiet&&window.AndroidAlarm.quiet(QUIET_SECS);}catch(e){}return;}
  pauseWebSound();webQuietUntil=Date.now()+QUIET_SECS*1000;
  clearTimeout(webQuietT);webQuietT=setTimeout(()=>{webQuietUntil=0;if(current&&M&&M.phase==='task'&&!alarmTimer)startWebSound(current);},QUIET_SECS*1000);
}
function webQuiet(){return Date.now()<webQuietUntil;}
['pointerdown','keydown','input','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(current&&M&&M.phase==='task'&&M.task&&SPOKEN(M.task.type)&&Date.now()-lastQuietPing>8000)quietMission();},{passive:true,capture:true}));

/* ---------- streak ---------- */
function markToday(quiet){
  const t=todayISO();if(S.lastCheckin===t)return false;
  const count=(S.streakCount||0)+1;
  S.streakCount=count;S.lastCheckin=t;S.longest=Math.max(S.longest||0,count);save();
  if(!FOCUS_OPEN)render();
  const L=LEVELS.find(l=>l.at===count);
  // Milestones (7, 14, 30, 60 days) open a Wayk-style recap of your studying so far, once the timer is closed.
  if(L){S.pendingRecap=count;save();if(!FOCUS_OPEN)maybeRecap();}else if(!quiet)toast('Day '+count+' — keep the chain going!');
  return true;
}
function undoToday(){
  const t=todayISO(),y=addDays(t,-1);if(S.lastCheckin!==t)return;
  const count=Math.max(0,(S.streakCount||0)-1);
  set({streakCount:count,lastCheckin:count>0?y:''});
}

let RECAP=null;
function recapStats(){
  const ss=(S.sessions||[]).filter(x=>x&&x.studyMin>0);
  if(!ss.length)return null;
  const total=ss.reduce((a,x)=>a+x.studyMin,0),longest=ss.reduce((a,x)=>x.studyMin>a.studyMin?x:a,ss[0]);
  const by=(k)=>{const m=new Map();ss.forEach(x=>{const v=x[k]||'';if(v)m.set(v,(m.get(v)||0)+x.studyMin);});return [...m].sort((a,b)=>b[1]-a[1]);};
  const subj=by('course'),days=by('day'),blocks=by('block');
  const first=ss.reduce((a,x)=>Math.min(a,x.start||Date.now()),Date.now());
  return {total,count:ss.length,avg:total/ss.length,longest,subj:subj[0],subjects:subj.length,day:days[0],block:blocks[0],goals:ss.filter(x=>x.goalHit).length,first};
}

function playVoiceAlert(event,force){

const SAY_KEEP=new Set(['AM','PM','OK','LORD','GOD','JESUS','CHRIST','US','UK','TV']);
function speakable(t){
  let s=String(t||'');
  s=s.replace(/\(\s*[A-Z]{2,6}\s*\)/g,' ').replace(/[\p{Extended_Pictographic}\uFE0F\u200D\u20E3]/gu,'');
  s=s.replace(/·/g,',').replace(/[—–]/g,', ').replace(/→/g,' ').replace(/…/g,'.').replace(/&/g,' and ').replace(/[#*_]/g,' ');
  s=s.replace(/\b[A-Z]{2,6}\s?-?\d{2,4}[A-Za-z]?\b/g,' ');
  s=s.replace(/\b(?!\d+(?:st|nd|rd|th)\b)(?=[A-Za-z0-9]*[A-Za-z])(?=[A-Za-z0-9]*\d)[A-Za-z0-9]+(?:[-/][A-Za-z0-9]+)*\b/g,' ');
  s=s.replace(/\b[A-Z]{2,6}\b/g,w=>SAY_KEEP.has(w)?w:' ');
  s=s.replace(/\(\s*\)/g,' ').replace(/\bpick up\s+(?=again\b|now\b|[.!?,]|$)/g,'pick it up ').replace(/\b(to|of|on|for|with|about)\s+(?=again\b|now\b|[.!?,]|$)/g,'$1 it ');

}

function restrictExitTyping(root){
  const phrase=root.querySelector('.exit-phrase');
  if(phrase)for(const event of ['selectstart','copy','cut','contextmenu','dragstart'])phrase.addEventListener(event,e=>{e.preventDefault();});

/* Typing only: blocks paste, drop and keyboard clipboard chips while normal typing and corrections still work. */
function noPasteField(root,input){
  const notice=()=>{const sh=root.querySelector('.sheet-body');let msg=root.querySelector('.exit-type-note');if(!msg&&sh){msg=document.createElement('p');msg.className='auth-err exit-type-note';msg.setAttribute('role','status');sh.appendChild(msg);}if(msg)msg.textContent='Type the sentence yourself. Copying and pasting are disabled.';};
  for(const event of ['paste','drop'])input.addEventListener(event,e=>{e.preventDefault();notice();});
  let previous=input.value||'',composing=false;
  input.addEventListener('compositionstart',()=>{composing=true;});
  input.addEventListener('compositionend',()=>{composing=false;previous=input.value;});
  input.addEventListener('beforeinput',e=>{
    if(e.inputType==='insertFromPaste'||e.inputType==='insertFromDrop'||!composing&&!e.isComposing&&e.data&&e.data.length>14&&(e.inputType==='insertText'||e.inputType==='insertReplacementText')){e.preventDefault();notice();}
  });
  // Some keyboard clipboard chips insert text without a cancellable beforeinput event.
  input.addEventListener('input',e=>{if(!composing&&!e.isComposing&&input.value.length-previous.length>14){input.value=previous;notice();return;}previous=input.value;});
}
/* Wayk-style scroll-wheel time picker (hour · minute · AM/PM) */
const WH=48;
function wheelHTML(time){
  const [h,m]=(time||'06:00').split(':').map(Number);
  const col=(k,items,sel,label)=>'<div class="wh-slot"><div class="wh-col" data-w="'+k+'" aria-label="'+label+'" tabindex="0"><div class="wh-pad"></div>'+items.map((x,i)=>'<div class="wh-it'+(i===sel?' on':'')+'">'+x+'</div>').join('')+'<div class="wh-pad"></div></div></div>';
  const hrs=Array.from({length:12},(_,i)=>String(i+1)),mins=Array.from({length:60},(_,i)=>pad2(i));
  return '<div class="wheel" id="wheel">'+col('h',hrs,(h%12||12)-1,'Hour')+'<div class="wh-sep">:</div>'+col('m',mins,m,'Minute')+col('ap',['AM','PM'],h>=12?1:0,'AM or PM')+'</div>';
}
function wheelTime(){
  const w=document.getElementById('wheel');if(!w)return null;
  const idx=k=>{const c=w.querySelector('[data-w="'+k+'"]');const n=c.querySelectorAll('.wh-it').length;return Math.max(0,Math.min(n-1,Math.round(c.scrollTop/WH)));};
  let h=idx('h')+1;const m=idx('m'),pm=idx('ap')===1;
  if(h===12)h=0;if(pm)h+=12;
  return pad2(h)+':'+pad2(m);
}
function ringInText(d){
  let at;
  if(d.repeat==='once')at=nextOnceAt(d.time);
  else{
    const [h,m]=(d.time||'06:00').split(':').map(Number),names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for(let i=0;i<8&&!at;i++){const x=new Date();x.setSeconds(0,0);x.setDate(x.getDate()+i);x.setHours(h,m);if(x.getTime()>Date.now()&&(d.days||[]).includes(names[x.getDay()]))at=x.getTime();}
  }
  if(!at)return 'Pick at least one day';
  const mins=Math.round((at-Date.now())/60000),dd=Math.floor(mins/1440),hh=Math.floor(mins%1440/60),mm=mins%60;
  return 'Rings in '+(dd?dd+'d ':'')+(dd||hh?hh+'h ':'')+mm+'m';
}
function initWheel(){
  const w=document.getElementById('wheel');if(!w||!SHEET||!SHEET.draft)return;
  w.querySelectorAll('.wh-col').forEach(c=>{
    const on=c.querySelector('.wh-it.on');const items=[...c.querySelectorAll('.wh-it')];
    c.scrollTop=Math.max(0,items.indexOf(on))*WH;
    let t=null;
    c.addEventListener('scroll',()=>{
      const i=Math.round(c.scrollTop/WH);items.forEach((x,j)=>x.classList.toggle('on',j===i));
      clearTimeout(t);t=setTimeout(()=>{
        const v=wheelTime();if(!v||!SHEET||!SHEET.draft)return;
        if(SHEET.draft.time!==v){SHEET.draft.time=v;if(navigator.vibrate)try{navigator.vibrate(8);}catch(e){}}
        const r=document.getElementById('ringIn');if(r)r.textContent=ringInText(SHEET.draft);
        const o=document.getElementById('onceTx');if(o)o.textContent=onceText(SHEET.draft);
      },90);
    },{passive:true});
    c.addEventListener('click',e=>{const it=e.target.closest('.wh-it');if(it)c.scrollTo({top:items.indexOf(it)*WH,behavior:'smooth'});});
    c.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();c.scrollBy({top:e.key==='ArrowUp'?-WH:WH,behavior:'smooth'});}});
  });
}

function nextOnceAt(time){const [h,m]=(time||'06:00').split(':').map(Number);const d=new Date();d.setSeconds(0,0);d.setHours(h,m);if(d.getTime()<=Date.now())d.setDate(d.getDate()+1);return d.getTime();}
function onceText(a){const at=a.onceAt&&a.onceAt>Date.now()&&!SHEET?a.onceAt:nextOnceAt(a.time);const d=new Date(at),t=new Date();const same=d.toDateString()===t.toDateString();t.setDate(t.getDate()+1);return (same?'today':d.toDateString()===t.toDateString()?'tomorrow':d.toLocaleDateString(undefined,{weekday:'long'}))+' '+fmt12(pad2(d.getHours())+':'+pad2(d.getMinutes()));}

function rhythm(){return (S.active&&S.active.rhythm)||RHYTHMS[S.focus.rhythm]||RHYTHMS['50/10'];}
function activeSessionMs(now){const a=S.active;if(!a)return 0;now=now||Date.now();return Math.max(0,(a.state==='paused'?a.pausedAt||now:now)-a.start-(a.pausedMs||0));}
/* Break time is a pool of minutes inside the session: e.g. 3 h on 50/10 gives 30 min, 3 h on 90/15 gives 25 min.
   Each 5/10/15-min break is taken out of that pool. Rhythm "Off" means no break time at all. */
function breakBudgetMin(goalMin,rh){const sm=rh&&rh[0]||0,bm=rh&&rh[1]||0;if(!sm||!bm||!goalMin)return 0;return Math.floor(goalMin*bm/(sm+bm)/5)*5;}
function breakLeftMs(now){const a=S.active;if(!a)return 0;now=now||Date.now();const cur=a.state==='break'?Math.max(0,Math.min(now,a.breakUntil)-(a.breakStart||now)):0;return Math.max(0,(a.breakBudgetMs||0)-(a.breakUsedMs||0)-cur);}
function breakChoices(){const a=S.active;if(!a||a.state!=='study'||a.goalHit)return [];const pool=breakLeftMs(),left=a.goalMin*60000-activeSessionMs();const ch=[5,10,15].filter(m=>m*60000<=pool&&m*60000<=left);const rest=Math.floor(Math.min(pool,left)/60000);if(!ch.length&&rest>=1)ch.push(rest);return ch;}
/* The break the reminder suggests: the rhythm's break, or the biggest piece still available. */
function suggestedBreak(){const ch=breakChoices(),[,bm]=rhythm();if(!ch.length)return 0;return ch.includes(bm)?bm:Math.max(...ch.filter(m=>m<=bm).concat(ch[0]));}
function initFocusPolicy(a){if(!a.rhythm)a.rhythm=(RHYTHMS[S.focus.rhythm]||RHYTHMS['50/10']).slice();if(a.breakBudgetMs===undefined){a.breakBudgetMs=breakBudgetMin(a.goalMin,a.rhythm)*60000;a.breakUsedMs=Math.min(a.breakBudgetMs,(a.breaks||0)*(a.rhythm[1]||0)*60000);}if(a.breakUsedMs===undefined)a.breakUsedMs=0;}

/* Up to 4 quick-pick subjects: today's planned one, then the most recently studied, then the rest in order. */
function topSubjects(names,sel){
  const last={};(S.sessions||[]).forEach(s=>{if(s&&s.course)last[s.course]=Math.max(last[s.course]||0,s.end||s.start||0);});
  const planNow=(S.tt[todayShort()+'|'+blockFor()]||'').trim();
  const order=names.slice().sort((a,b)=>(b===planNow)-(a===planNow)||(last[b]||0)-(last[a]||0)||names.indexOf(a)-names.indexOf(b));
  const top=order.slice(0,4);
  if(sel&&sel!=='__other'&&names.includes(sel)&&!top.includes(sel))top[top.length-1]=sel;
  return top;
}

let webRec=null,speechSequence=0;
function cancelSpeech(){
  if(M&&M.task){M.task.listening=false;M.task.speechRequest=null;}
  if(webRec){const rec=webRec;webRec=null;rec.onresult=rec.onerror=rec.onend=null;try{rec.abort();}catch(e){}}
  if(IS_APP){try{window.AndroidAlarm.cancelListening&&window.AndroidAlarm.cancelListening();}catch(e){}}
}
function speechReady(request){return missionReady()&&SPOKEN(M.task.type)&&M.task.listening&&(request==null?M.task.speechRequest==null:String(request)===M.task.speechRequest);}
function startSpeech(){
  if(!missionReady()||!SPOKEN(M.task.type)||M.task.listening)return;
  stopVoice();
  const t=M.task,request=String(++speechSequence);t.speechRequest=request;t.listening=true;M.msg='';drawAlarm();
  if(IS_APP){try{if(window.AndroidAlarm.listenMission)window.AndroidAlarm.listenMission(request);else{t.speechRequest=null;window.AndroidAlarm.listen();}}catch(e){speechFail(-2,t.speechRequest);}return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){speechFail(-1,request);return;}
  pauseWebSound();
  try{
    webRec=new SR();webRec.lang='en-US';webRec.maxAlternatives=5;webRec.interimResults=false;webRec.continuous=false;
    webRec.onresult=e=>{const alts=[];for(const res of e.results)for(const a of res)alts.push(a.transcript);onSpeech(alts.join('|'),request);};
    webRec.onerror=()=>speechFail(-1,request);
    webRec.onend=()=>{if(!speechReady(request))return;if(t.listening){speechFail(-1,request);return;}if(current&&S.sound&&!IS_APP&&!alarmTimer&&!webQuiet())startWebSound(current);};
    webRec.start();
  }catch(e){speechFail(-2,request);}
}
function onSpeech(text,request){
  if(!speechReady(request))return;
  const t=M.task;t.listening=false;
  if(!IS_APP&&current&&!webQuiet())startWebSound(current);
  const alts=String(text||'').split('|').filter(Boolean);
  // Keep the words already heard (a long verse can be read in parts), add the best of this attempt.
  const prog=speechProgress(alts,t.q,t.heard);t.heard=prog.flags;
  if(prog.pass(t.type==='affirm'?0.8:0.75)){
    // Bible: after the NKJV, say it again in the NLT for better understanding (when we have it).
    if(t.type==='bible'&&t.step!=='nlt'){const n=NLT[String(t.ref||'').trim()];
      if(n){t.step='nlt';t.first=t.q;t.q=n;t.heard=null;M.micFails=0;M.msg='';buzz('right');drawAlarm();
        playVoiceAlert('bible_nlt',true);return;}}
    missionStep();return;}
  M.micFails=(M.micFails|0)+1;
  const pct=Math.round(prog.score*100),next=prog.nextWord;
  M.msg=!alts.length?'I didn’t catch that. Try again.'
    :prog.blocked?'Don’t skip “'+prog.blocked+'” — it changes the meaning. Try again.'
    :pct>=20&&next?pct+'% done — keep going from “'+next+'”. The green words are already counted.'
    :'I heard: “'+alts[0]+'”. Try again, clearly and a little slower.';
  buzz('wrong');drawAlarm(true);
}
function speechFail(error,request){
  if(!speechReady(request))return;
  const t=M.task;t.listening=false;
  if(!IS_APP&&current&&!alarmTimer&&!webQuiet())startWebSound(current);
  M.micFails=(M.micFails|0)+1;M.msg='Couldn’t hear you. Try again.';buzz('wrong');drawAlarm(true);
}
window.__onSpeech=onSpeech;
window.__onSpeechError=speechFail;

let motionBound=false;
function onMotion(e){
  if(!missionReady()||M.task.type!=='shake')return;
  const t=M.task,dynamic=e.acceleration&&[e.acceleration.x,e.acceleration.y,e.acceleration.z].every(Number.isFinite),a=dynamic?e.acceleration:e.accelerationIncludingGravity;
  if(!a||![a.x,a.y,a.z].every(Number.isFinite))return;
  const magnitude=Math.hypot(a.x,a.y,a.z),force=dynamic?magnitude:Math.abs(magnitude-9.81),now=Date.now();
  if(force<4)t.armed=true;
  if(force>11&&t.armed&&now-t.lastShake>220){
    t.armed=false;t.lastShake=now;M.motionOk=true;t.got++;
    if(t.got>=t.need){missionStep();return;}
    const n=$('#shakeN');if(n){n.textContent=t.got;const ring=n.closest('.shake-ring');if(ring){const pct=Math.round(t.got/t.need*100);ring.style.background='conic-gradient(var(--accent-2) '+(pct*3.6)+'deg, rgba(255,255,255,.1) 0deg)';}}
    const ns=$('#noShake');if(ns)ns.style.display='none';
  }
}
function setupShake(){
  if(!motionBound){window.addEventListener('devicemotion',onMotion);motionBound=true;}
}

  try{new Notification(title,opts);return true;}catch(e){return false;}

function clearTodayNotified(){const today=new Date().toDateString();const out={};Object.keys(S.notified||{}).forEach(k=>{if(k.indexOf(today+'|')!==0)out[k]=S.notified[k];});S.notified=out;}
function checkReminders(){
  if(IS_APP||ALARM_MODE||current)return;
  const now=new Date(),today=now.toDateString(),nowMin=now.getHours()*60+now.getMinutes(),d=todayShort();
  const n=S.notified||(S.notified={});let changed=false;
  Object.keys(n).forEach(k=>{if(k.indexOf(today+'|')!==0){delete n[k];changed=true;}});
  const inWin=t=>{const s=toMin(t);return nowMin>=s&&nowMin<s+RING_WINDOW;};
  let fired=false;
  for(const a of S.wakeAlarms){
    if(!a.on||!a.time)continue;
    if(a.repeat==='once'){if(!a.onceAt||new Date(a.onceAt).toDateString()!==today)continue;}
    else if(!(a.days||[]).includes(d))continue;
    const key=today+'|W'+a.id+a.time;
    if(inWin(a.time)&&!n[key]){n[key]=1;changed=true;fired=true;if(a.repeat==='once')a.on=false;ringAlarm(alarmInfo(a));break;}
  }
  if(!fired&&S.reminderOn){
    const yd=DAYS[(DAYS.indexOf(d)+6)%7];
    for(const slot of SLOTS){
      let time=S.ttTime[d+'|'+slot],src=d;
      if(time&&wraps(slot,time))time=null;                     // tonight's after-midnight time rings tomorrow
      if(!time&&slot==='Night'&&wraps('Night',S.ttTime[yd+'|Night'])){time=S.ttTime[yd+'|Night'];src=yd;}
      if(!time)continue;
      const key=today+'|'+slot+(src!==d?'-late':'');
      if(inWin(time)&&!n[key]){n[key]=1;changed=true;fired=true;const subj=(S.tt[src+'|'+slot]||'').trim();ringAlarm({title:'Study time — '+slot,body:subj?subj+' · '+fmt12(time):'Time for your '+slot.toLowerCase()+' study block.',mission:false,kind:'study',snoozeLeft:1,cfg:{snoozeMax:1,snoozeMin:5}});break;}
    }
  }
  if(changed)save();
}

function alarmInfo(a){return {title:a.name||(a.type==='normal'?'Alarm':'Wake up'),body:a.type==='normal'?'Time to get up.':'Good morning! Complete the mission to stop the alarm.',mission:a.type!=='normal',kind:'wake',cfg:alarmCfg(a),sound:a.sound,check:!!a.check,...alarmExtras()};}
function syncNative(){
  if(!IS_APP||ALARM_MODE)return;
  const alarms=[],dayNum=d=>DAYS.indexOf(d)+1;
  S.wakeAlarms.forEach(a=>{
    if(!a.on||!a.time)return;const[h,m]=a.time.split(':').map(Number);const info=alarmInfo(a);
    const base=Object.assign({},info,{snoozeMax:info.cfg.snoozeMax});
    if(a.repeat==='once'){if(a.onceAt>Date.now())alarms.push(Object.assign({},base,{id:'o'+a.id,at:a.onceAt,hour:h,minute:m,day:0}));return;}
    (a.days||[]).forEach(d=>alarms.push(Object.assign({},base,{id:'w'+a.id+d,day:dayNum(d),hour:h,minute:m})));
  });
  if(S.reminderOn){
    DAYS.forEach(d=>{
      SLOTS.forEach(slot=>{const t=S.ttTime[d+'|'+slot];if(!t)return;const[h,m]=t.split(':').map(Number);const subj=(S.tt[d+'|'+slot]||'').trim();alarms.push({id:'s'+d+slot,kind:'study',day:wraps(slot,t)?(dayNum(d)%7)+1:dayNum(d),hour:h,minute:m,title:'Study time — '+slot,body:subj?subj+' · '+fmt12(t):'Time for your '+slot.toLowerCase()+' study block.',mission:false,snoozeMax:1,cfg:{snoozeMax:1,snoozeMin:5},sound:{kind:'builtin',id:'bells'}});});
    });

  const focusQuote={on:S.dailyQuote!==false,hour:7,minute:0,name:(S.name||'').trim(),quotes:QUOTES};
  try{window.AndroidAlarm.setSchedule(JSON.stringify({alarms,snoozeMax:2,focusQuote}));}catch(e){}
}

/* ---------- calendar export ---------- */
function exportCalendar(){
  const events=[];const now=new Date();const stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  DAYS.forEach((d,di)=>{SLOTS.forEach(slot=>{
    const time=S.ttTime[d+'|'+slot];if(!time)return;
    // first occurrence on/after today
    const first=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const late=wraps(slot,time),di2=late?(di+1)%7:di;
    const diff=(di2-((now.getDay()+6)%7)+7)%7;first.setDate(first.getDate()+diff);
    const [h,m]=time.split(':').map(Number);
    const startStr=first.getFullYear()+pad2(first.getMonth()+1)+pad2(first.getDate())+'T'+pad2(h)+pad2(m)+'00';
    const length=60;
    const subj=(S.tt[d+'|'+slot]||'').trim();
    const icsEsc=s=>s.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
    events.push(['BEGIN:VEVENT','UID:rexi-planner-'+d+'-'+slot+'@rexi-planner.netlify.app','DTSTAMP:'+stamp,'DTSTART:'+startStr,'DURATION:PT'+length+'M','RRULE:FREQ=WEEKLY;BYDAY='+ICS_DAY[DAYS[di2]],'SUMMARY:'+icsEsc('Study: '+(subj||slot+' block')),'DESCRIPTION:'+icsEsc('From Rexi Rise'),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Study time: '+(subj||slot+' block')),'TRIGGER:PT0M','END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Study in 10 minutes: '+(subj||slot+' block')),'TRIGGER:-PT10M','END:VALARM','END:VEVENT'].join('\r\n'));
  });});
  if(!events.length){toast('Add start times to your timetable first');set({activeTab:'plan',planTab:'timetable'});return;}
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rexi//Rexi Rise//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Study timetable',...events,'END:VCALENDAR'].join('\r\n');
  downloadFile('study-timetable.ics',ics,'text/calendar');
  toast(events.length+' study block'+(events.length===1?'':'s')+' ready \u2014 open the file to add them');
}
function downloadFile(name,text,type){
  if(IS_APP){let ok=false;try{ok=window.AndroidAlarm.saveFile(name,type,text);}catch(e){}toast(ok?'Saved to your Downloads folder':'Couldn\u2019t save the file');return;}
  const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

    case 'fSilence':S.focus.silence=S.focus.silence===false;set({});if(S.active)focusSync();if(S.focus.silence&&IS_APP){const st=nativeStatus();if(st&&st.dndAccess===false)try{window.AndroidAlarm.openSettings('dndaccess');}catch(e){}}break;

    case 'theme':set({theme:el.dataset.t,themeChosen:true});applyTheme();break;

    case 'authGo':grab();AV.screen=el.dataset.s;AV.err='';AV.msg='';AV.show=false;renderAuth();{const f=document.querySelector('#auth .auth-in');if(f&&AV.screen!=='start')setTimeout(()=>f.focus(),50);}break;

    case 'syncNow':syncNow();break;
    case 'logout':logout();break;
    case 'deleteAccount':deleteAccount();break;
    case 'useCloud':useCloud();break;
    case 'useLocal':useLocal();break;
    case 'restore':restore();break;
    /* alarms */
    case 'toggleReminder':toggleReminder();break;
    case 'testAlarm':testAlarm();break;
    case 'newAlarm':ALARM_MENU=false;editAlarm(null);break;
    case 'alarmMenu':ALARM_MENU=!ALARM_MENU;render();break;
    case 'alarmMenuClose':ALARM_MENU=false;render();break;
    case 'alarmNew':ALARM_MENU=false;render();editAlarm(null);break;
    case 'alarmSort':ALARM_MENU=false;set({alarmSort:el.dataset.s});break;
    case 'alarmDelInactive':{ALARM_MENU=false;render();const n=S.wakeAlarms.filter(a=>!a.on).length;if(!n)break;ask('Delete '+n+' inactive alarm'+(n===1?'':'s')+'?','Alarms that are switched off will be removed. Active alarms stay.','Delete',true).then(ok=>{if(!ok)return;set({wakeAlarms:S.wakeAlarms.filter(a=>a.on)});toast(n+' inactive alarm'+(n===1?'':'s')+' deleted');});break;}
    case 'editAlarmName':{const name=$('#alarmName');if(name){name.focus();name.select();}}break;
    case 'editAlarm':editAlarm(i);break;
    case 'wakeToggle':S.wakeAlarms[i].on=!S.wakeAlarms[i].on;if(S.wakeAlarms[i].on&&S.wakeAlarms[i].repeat==='once')S.wakeAlarms[i].onceAt=nextOnceAt(S.wakeAlarms[i].time);set({});if(S.wakeAlarms[i]&&S.wakeAlarms[i].on)toast('Alarm on · '+(S.wakeAlarms[i].repeat==='once'?onceText(S.wakeAlarms[i]):fmt12(S.wakeAlarms[i].time)+' · '+daysSummary(S.wakeAlarms[i].days)));else toast('Alarm off');break;
    case 'openQuestions':openSheet({kind:'questions',prev:SHEET&&SHEET.kind!=='questions'?SHEET:null});break;
    case 'closeSheet':closeSheet();break;
    case 'saveSheet':saveSheet();break;
    case 'deleteAlarm':{const idx=SHEET.idx;ask('Delete this alarm?','It won’t ring again.','Delete',true).then(ok=>{if(!ok||!SHEET||SHEET.idx!==idx)return;S.wakeAlarms.splice(idx,1);SHEET=null;closeSheet();set({});toast('Alarm deleted');});break;}
    case 'draftDay':{const d=SHEET.draft,x=el.dataset.d;d.days=d.days.includes(x)?d.days.filter(y=>y!==x):DAYS.filter(y=>y===x||d.days.includes(y));renderSheet();break;}
    case 'draftType':if(SHEET.kind==='mission')SHEET.panel=true;missionDraft().type=el.dataset.t;if(SPOKEN(el.dataset.t)&&IS_APP)try{window.AndroidAlarm.requestMic();}catch(e){}renderSheet();break;
    case 'draftLevel':missionDraft().level=el.dataset.l;renderSheet();break;
    case 'draftCount':{const md=missionDraft();md.count=Math.max(1,Math.min(10,(md.count|0)+(+el.dataset.n)));}renderSheet();break;
    case 'draftSnoozeMin':SHEET.draft.snooze.min=+el.dataset.n;renderSheet();break;
    case 'draftSnoozeOn':SHEET.draft.snooze.on=!SHEET.draft.snooze.on;renderSheet();break;
    case 'draftCheck':{let x=SHEET;while(x&&!x.draft)x=x.prev;x.draft.check=!x.draft.check;renderSheet();break;}
    case 'draftKind':SHEET.draft.type=el.dataset.k;renderSheet();break;
    case 'draftRepeat':SHEET.draft.repeat=el.dataset.r;renderSheet();break;
    case 'openMission':openSheet({kind:'mission',prev:SHEET});break;
    case 'openSound':openSheet({kind:'sound',prev:SHEET});break;
    case 'openSoundCat':if(SOUND_CATS.includes(el.dataset.cat)){stopPreview();openSheet({kind:'soundTracks',cat:el.dataset.cat,prev:SHEET});}break;
    case 'soundCredits':stopPreview();openSheet({kind:'soundCredits',prev:SHEET});break;
    case 'pickBuiltin':{const d=soundAlarmDraft();if(!d)break;d.sound={kind:'builtin',id:soundId(el.dataset.id)};renderSheet();previewSound(d.sound);}break;
    case 'previewSound':previewSound({kind:'builtin',id:el.dataset.id});break;
    case 'pickSound':if(!IS_APP){toast('Upload and phone tones are available in the Android app');break;}try{window.AndroidAlarm.pickSound(el.dataset.k);}catch(e){toast('Couldn\u2019t open the sound picker');}break;
    case 'closeSound':stopPreview();if(SHEET&&SHEET.kind==='soundTracks')SHEET=SHEET.prev;closeSheet();break;
    case 'previewMission':testAlarm(SHEET.kind==='alarm'?SHEET.draft:SHEET.prev.draft);break;
    case 'addQ':S.questions.push({id:uid(),q:'',a:'',course:''});save();renderSheet();setTimeout(()=>{const ins=document.querySelectorAll('#sheet .q-q');const l=ins[ins.length-1];if(l)l.focus();},30);break;
    case 'rmQ':{const q=S.questions[i];const go=()=>{const k=S.questions.indexOf(q);if(k>=0){S.questions.splice(k,1);save();renderSheet();}};if(q.q||q.a)ask('Remove this question?','','Remove',true).then(ok=>ok&&go());else go();break;}
    case 'bulkQ':{const ta=$('#bulkQ');if(!ta)break;let n=0;ta.value.split(/\n+/).forEach(line=>{const m=line.split(/\s*(?:=|\||\t| - )\s*/);if(m.length>=2&&m[0].trim()&&m[1].trim()){S.questions.push({id:uid(),q:m[0].trim(),a:m.slice(1).join(' ').trim(),course:''});n++;}});save();renderSheet();toast(n?'Added '+n+' question'+(n===1?'':'s'):'Write each one as: question = answer');break;}
    case 'fixPerm':try{window.AndroidAlarm.openSettings(el.dataset.w);}catch(e){}break;
    case 'exportCal':exportCalendar();break;
    /* mission screen */
    case 'tile':tapTile(+el.dataset.n);break;
    case 'quizPick':if(chooseQuiz(Number(el.dataset.i)))el.classList.add('ok');break;
    case 'startMission':if(M&&M.phase==='intro'){M.phase='task';drawAlarm();}break;
    case 'finishAlarm':finishAlarm();break;
    case 'mCat':SHEET.cat=el.dataset.c;renderSheet();break;
    case 'missionDone':closeSheet();break;
    case 'previewOne':{e.stopPropagation&&e.stopPropagation();let x=SHEET;while(x&&!x.draft)x=x.prev;const d=JSON.parse(JSON.stringify(x.draft));d.mission.type=el.dataset.t;d.mission.count=1;testAlarm(d);break;}
    case 'openPacks':openSheet({kind:'packs',which:el.dataset.w,prev:SHEET});break;
    case 'packToggle':{const cfg=missionDraft(),w=SHEET.which,id=el.dataset.id;
      if(w==='random'){const sel=(cfg.pool||POOL_TYPES.slice());cfg.pool=sel.includes(id)?sel.filter(x=>x!==id):POOL_TYPES.filter(x=>x===id||sel.includes(x));}
      else{const key=w==='bible'?'verses':w==='affirm'?'affirms':'topics';const all=w==='bible'?allVerseIds():(w==='affirm'?AFFIRM_PACKS:QUIZ_TOPICS).map(p=>p.id);const sel=cfg[key]||all;const nx=sel.includes(id)?sel.filter(x=>x!==id):all.filter(x=>x===id||sel.includes(x));if(!nx.length){toast('Keep at least one');break;}cfg[key]=nx.length===all.length?null:nx;}
      renderSheet();break;}
    case 'packAll':{const cfg=missionDraft(),w=SHEET.which;
      if(w==='random'){cfg.pool=(cfg.pool||POOL_TYPES).length===POOL_TYPES.length?[]:null;}
      else{const key=w==='bible'?'verses':w==='affirm'?'affirms':'topics';const all=w==='bible'?allVerseIds():(w==='affirm'?AFFIRM_PACKS:QUIZ_TOPICS).map(p=>p.id);const sel=cfg[key]||all;cfg[key]=sel.length===all.length?[all[0]]:null;if(sel.length===all.length)toast('Pick the ones you want');}
      renderSheet();break;}
    case 'myVerse':openSheet({kind:'myverse',prev:SHEET});break;
    case 'saveVerse':{const tx=(($('#mvText')||{}).value||'').trim(),rf=(($('#mvRef')||{}).value||'').trim();if(tx.split(/\s+/).length<3){toast('Type the verse first');break;}S.myVerses=S.myVerses||[];S.myVerses.push({id:uid(),text:tx,ref:rf});save();toast('Verse added');closeSheet();break;}
    case 'rmVerse':S.myVerses=(S.myVerses||[]).filter(v=>v.id!==el.dataset.id);save();renderSheet();break;
    case 'openCheck':openSheet({kind:'check',prev:SHEET});break;
    case 'openSet':openSheet({kind:'set',k:el.dataset.k,live:true});break;
    case 'openSetSub':openSheet({kind:'set',k:el.dataset.k,live:true,prev:SHEET});break;
    case 'apToggle':{const p=AP();p[el.dataset.f]=p[el.dataset.f]===undefined?el.dataset.f!=='vibrate':!p[el.dataset.f];set({});break;}
    case 'support':supportMail(el.dataset.k);break;
    case 'whatsapp':supportWhatsApp();break;
    case 'speak':startSpeech();break;
    case 'kp':kpPress(el.dataset.k);break;
    case 'missionBack':missionBack();break;
    case 'resumeFocus':resumeFocus();break;
    case 'allowMic':if(IS_APP){try{window.AndroidAlarm.requestMic();}catch(e){}setTimeout(()=>{if(M)drawAlarm();},2500);}else startSpeech();break;
    case 'noMic':if(missionReady()){cancelSpeech();stopVoice();M.noMic=true;M.task=newTask();drawAlarm();}break;
    case 'noShake':if(missionReady()){M.noShake=true;M.task=newTask();drawAlarm();}break;
    case 'motionPerm':try{DeviceMotionEvent.requestPermission().then(r=>{if(r==='granted'&&M){M.motionOk=true;drawAlarm();}});}catch(e){}break;
    case 'stopAlarm':stopAlarm();break;
    case 'snooze':snooze();break;
  }
});

/* ---------- backup ---------- */
function backup(){downloadFile('rexi-rise-backup-'+todayISO()+'.json',JSON.stringify(S,null,2),'application/json');if(!IS_APP)toast('Backup downloaded');}
function restore(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.courses))throw 0;const modern=Object.prototype.hasOwnProperty.call(o,'wakeAlarms')||Object.prototype.hasOwnProperty.call(o,'focus')||o.courses.some(c=>c&&Object.prototype.hasOwnProperty.call(c,'diff'));const restored=modern?Object.assign(defaults(),o):migrateV3(o);restored.activeTab='settings';localStorage.setItem(KEY,JSON.stringify(restored));clearTimeout(saveT);S=restored;syncNative();location.reload();}catch(e){toast('That file isn’t a planner backup');}};r.readAsText(f);};
  inp.click();
}

/* ---------- theme ---------- */
const darkMQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
window.__applyBars=()=>applyTheme();
function applyTheme(){
  const t=S.theme||'light',root=document.documentElement;
  if(t==='light'||t==='dark')root.setAttribute('data-theme',t);else root.removeAttribute('data-theme');
  const dark=t==='dark'||(t==='system'&&darkMQ&&darkMQ.matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{m.setAttribute('content',dark?'#000000':'#F4EFE6');m.removeAttribute('media');});
  const sp=document.getElementById('splash');
  if(IS_APP&&!ALARM_MODE&&!(sp&&!sp.classList.contains('out'))){try{window.AndroidAlarm.setBars(dark?'#000000':'#F4EFE6',!dark);}catch(e){}}
}
if(darkMQ&&darkMQ.addEventListener)darkMQ.addEventListener('change',applyTheme);

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2800);}

/* ---------- boot ---------- */
(function boot(){
  if(ALARM_MODE){
    let info={};try{info=JSON.parse(ALARM_INFO||new URLSearchParams(location.search).get('alarm'))||{};}catch(e){}
    document.body.classList.add('alarm-mode');applyTheme();ringAlarm(info);
    window.__planner={state:()=>S,task:()=>M&&M.task};
    return;
  }
  applyTheme();
  focusBoot();
  // Swipe left / right to move between side-by-side tabs: Home (Study · Alarms · Schedule),
  // Plan (Timetable · Courses) and, in the alarm editor, Scheduled · One-time.
  (()=>{let sx=0,sy=0,st=0,zone=null;
    const zoneOf=t=>{
      if(ASK||FOCUS_OPEN||document.getElementById('tour')||t.closest('input,textarea,select,.wheel,[data-noswipe],nav,header'))return null;
      if(SHEET)return SHEET.kind==='alarm'&&t.closest('#sheet .sheet-body')?'repeat':null;
      if(!t.closest('#main'))return null;
      return S.activeTab==='home'?'home':S.activeTab==='plan'?'plan':null;};
    document.addEventListener('touchstart',e=>{zone=e.touches.length===1?zoneOf(e.target):null;
      for(let n=e.target;zone&&n&&n!==document.body;n=n.parentElement)if(n.scrollWidth>n.clientWidth+2&&/auto|scroll/.test(getComputedStyle(n).overflowX))zone=null;
      const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();},{passive:true});
    document.addEventListener('touchend',e=>{const z=zone;zone=null;if(!z)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
      if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.6||Date.now()-st>700)return;
      const step=(order,cur)=>{const i=Math.max(0,order.indexOf(cur)),j=i+(dx<0?1:-1);return j>=0&&j<order.length?order[j]:null;};
      if(z==='home'){const n=step(['study','alarms','blocks'],S.homeTab||'study');if(n)set({homeTab:n});}
      else if(z==='plan'){const n=step(['timetable','courses'],S.planTab||'timetable');if(n)set({planTab:n});}
      else if(z==='repeat'&&SHEET&&SHEET.draft){const d=SHEET.draft,n=step(['scheduled','once'],d.repeat||'scheduled');if(n){d.repeat=n;renderSheet();const c=$('#sheet .once-card')||$('#sheet .days-card');if(c)c.classList.add(dx<0?'from-r':'from-l');}}
    },{passive:true});
  })();
  render();
  if(FOCUS_OPEN)renderFocus();
  setTimeout(maybeRecap,2600); // a milestone reached while the timer was open
  focusTimer=setInterval(focusTick,1000);
  setInterval(()=>{checkReminders();if(S.activeTab==='home'&&!FOCUS_OPEN&&!$('#layer').innerHTML&&!SHEET&&!document.activeElement.matches('input,textarea'))render();},30000);
  setTimeout(checkReminders,800);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){focusTick();checkReminders();if(!FOCUS_OPEN&&(S.activeTab==='home'||S.activeTab==='alarms'||S.activeTab==='settings'||S.activeTab==='progress')&&!document.activeElement.matches('input,textarea'))render();}});
  window.addEventListener('focus',checkReminders);
  syncNative();focusSync();
  setTimeout(prefetchNLT,8000);
  if('serviceWorker' in navigator&&!IS_APP&&location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').then(r=>{swReg=r;}).catch(()=>{});
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='stop-alarm')stopAlarm();});
  }
  window.__planner={state:()=>S,task:()=>M&&M.task,check:checkReminders,tick:focusTick,
    returnToStudy:()=>{if(!S.active)return false;focusTick();if(S.active.state!=='study')return false;SHEET=null;closeSheet();FOCUS_OPEN=true;renderFocus();return true;},
    refresh:()=>{if(FOCUS_OPEN){focusTick();renderFocus();return;}if(!document.activeElement.matches('input,textarea'))render();if(SHEET&&SHEET.kind==='focus')renderSheet();},
    blocked:label=>window.__focusBlocked(label),
    back:()=>{if(ASK){ASK.done(false);return true;}if(current)return true;if(document.getElementById('tour')){if(TOUR_I>0){TOUR_I--;renderTour();}return true;}if(SHEET){closeSheet();return true;}if(FOCUS_OPEN){if(BREAK_PICK){BREAK_PICK=false;renderFocus();return true;}if(canMinimise()){FOCUS_OPEN=false;closeFocus();render();}return true;}if(S.activeTab!=='home'){set({activeTab:'home'});scrollTo(0,0);return true;}return false;}};
  // No welcome tour: sign-up asks for the name, the + button adds alarms, Home shows any missing permissions.
  if(!S.onboarded){S.onboarded=true;save();}
  if(authOn()&&AUTH&&AUTH.pending)setTimeout(()=>afterLogin(false),800);
})();

})();
</script>
