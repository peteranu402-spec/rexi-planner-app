<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rexi Rise</title>
<meta name="description" content="Plan your semester, focus with a study timer, and wake up on time with mission alarms.">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rexi Rise">
<script>try{var o=JSON.parse(localStorage.getItem("sem-planner-v4"))||{},t=o.themeChosen?o.theme:"light";if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Roboto, the font Wayk uses, bundled with the app so every phone shows the same letters */
@font-face{font-family:'Rexi Roboto';src:url('fonts/Roboto.ttf') format('truetype');font-weight:100 900;font-stretch:100%;font-style:normal;font-display:swap}
html,body{font-stretch:100%}
:root{
  --bg:#F4EFE6; --surface:#FFFDF9; --surface-2:#F8F3EA; --surface-3:#EFE7DA;
  --ink:#1F1A16; --ink-2:#3B342D; --muted:#6F665C; --faint:#A1978A; --line:#E7DFD1;
  --accent:#C4572F; --accent-ink:#fff; --brand:#C4572F; --brand-ink:#fff; --btn:#1F1A16; --btn-ink:#fff; --accent-soft:#F8E4D9; --accent-2:#E8925F;
  --hero:#221C17; --hero-ink:#F7F0E6; --hero-muted:#BDAF9E;
  --hard:#D32F2F; --hard-soft:#FDE3E3; --hard-ink:#B71C1C;
  --semi:#E8A400; --semi-soft:#FFF3CF; --semi-ink:#8A5D00;
  --easy:#2E7D32; --easy-soft:#E3F3E4; --easy-ink:#1B5E20;
  --good:#2E7D32; --warn:#B07800; --break:#2F7DD1;
  --shadow:0 1px 2px rgba(40,28,16,.05),0 6px 20px -8px rgba(40,28,16,.12);
  --r:18px; --r-sm:12px;
  --sans:'Rexi Roboto','Roboto',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif; --display:var(--sans);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --surface-2:#232325; --surface-3:#2C2C2E;
    --ink:#FFFFFF; --ink-2:#E5E5E7; --muted:#9A9AA0; --faint:#636366; --line:#2C2C2E;
    --accent:#FFFFFF; --accent-ink:#000000; --brand:#E2734A; --brand-ink:#fff; --btn:#FFFFFF; --btn-ink:#000; --accent-soft:#2C2C2E; --accent-2:#F08A5D;
    --hero:#1C1C1E; --hero-ink:#FFFFFF; --hero-muted:#A1A1A6;
    --hard:#FF6B6B; --hard-soft:#3A1E1E; --hard-ink:#FF8A8A;
    --semi:#FFC233; --semi-soft:#3A3120; --semi-ink:#FFD36B;
    --easy:#5FD18A; --easy-soft:#173326; --easy-ink:#7FE0A3;
    --good:#5FD18A; --warn:#FFC233; --break:#6CB4FF;
    --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#000000; --surface:#1C1C1E; --surface-2:#232325; --surface-3:#2C2C2E;
    --ink:#FFFFFF; --ink-2:#E5E5E7; --muted:#9A9AA0; --faint:#636366; --line:#2C2C2E;
    --accent:#FFFFFF; --accent-ink:#000000; --brand:#E2734A; --brand-ink:#fff; --btn:#FFFFFF; --btn-ink:#000; --accent-soft:#2C2C2E; --accent-2:#F08A5D;
    --hero:#1C1C1E; --hero-ink:#FFFFFF; --hero-muted:#A1A1A6;
    --hard:#FF6B6B; --hard-soft:#3A1E1E; --hard-ink:#FF8A8A;
    --semi:#FFC233; --semi-soft:#3A3120; --semi-ink:#FFD36B;
    --easy:#5FD18A; --easy-soft:#173326; --easy-ink:#7FE0A3;
    --good:#5FD18A; --warn:#FFC233; --break:#6CB4FF;
    --shadow:none;
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
input::placeholder{color:var(--faint)}
::selection{background:var(--accent-soft)}
.app{min-height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
/* Header */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 20px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(180deg,#F2A06B,#C4572F);display:grid;place-items:center;flex:none;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent) 70%,transparent)}
.logo svg{width:28px;height:28px}
.eyebrow{font:700 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.title{font:700 21px/1.15 var(--display);letter-spacing:-.01em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none;transition:.15s}
.icon-btn:hover{color:var(--ink)}
.icon-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* Layout */
.shell{flex:1;display:flex;min-height:0}
main{flex:1;min-width:0;padding:6px 20px calc(110px + env(safe-area-inset-bottom))}
.view{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.view.enter{animation:viewIn .28s cubic-bezier(.2,.8,.2,1)}
.from-r,.view.enter.from-r{animation:paneR .26s cubic-bezier(.2,.8,.2,1)}
.from-l,.view.enter.from-l{animation:paneL .26s cubic-bezier(.2,.8,.2,1)}
@keyframes paneR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes paneL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.home-pane{display:flex;flex-direction:column;gap:inherit}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tab{-webkit-tap-highlight-color:transparent}
.tab:active .pill{transform:scale(.88)}
.tab.pop .pill{animation:tabPop .35s cubic-bezier(.2,1.6,.4,1)}
.tab.pop svg{animation:iconHop .35s ease}
@keyframes tabPop{0%{transform:scale(.6);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes iconHop{0%{transform:translateY(0)}40%{transform:translateY(-3px)}100%{transform:translateY(0)}}
.plan-seg button,.theme-seg button,.lvl-seg button,.mchip{transition:background .2s,color .2s,transform .12s}
.plan-seg button:active,.theme-seg button:active,.mchip:active,.btn:active,.row-btn:active,.mcard:active,.pk-row:active{transform:scale(.97)}
.btn,.row-btn,.mcard,.pk-row{transition:transform .12s,background .2s}
@media (prefers-reduced-motion:reduce){.view.enter,.tab.pop .pill,.tab.pop svg{animation:none}.tab:active .pill,.btn:active,.row-btn:active,.mcard:active,.pk-row:active{transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs-inner{display:flex;width:100%;max-width:520px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:none;background:none;color:var(--faint);font:600 10.5px var(--sans);border-radius:12px;transition:.15s}
.tab svg{width:22px;height:22px}
.tab .pill{padding:3px 14px;border-radius:999px;transition:.2s}
.tab.on{color:var(--accent)}
.tab.on .pill{background:var(--accent-soft)}
@media (min-width:900px){
  nav.tabs{position:sticky;top:76px;align-self:flex-start;flex-direction:column;width:200px;padding:8px 0 0 20px;background:none;border:none;backdrop-filter:none}
  .tabs-inner{flex-direction:column;gap:4px}
  .tab{flex-direction:row;gap:12px;padding:10px 12px;font-size:14px;justify-content:flex-start}
  .tab .pill{padding:0;background:none!important}
  .tab.on{background:var(--accent-soft)}
  main{padding-bottom:60px}
}
/* Cards & type */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.h-sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px}
.al-head{position:relative;align-items:center}
.recap{position:fixed;inset:0;z-index:96;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 0 calc(env(safe-area-inset-bottom) + 12px);animation:fade .2s ease}
.rc-top{display:flex;align-items:center;gap:14px;padding:0 18px}
.rc-bars{flex:1;display:flex;gap:5px}.rc-bars i{flex:1;height:3px;border-radius:3px;background:var(--line)}.rc-bars i.on{background:var(--ink)}
.rc-x{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-3);color:var(--muted);display:grid;place-items:center}
.rc-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px;position:relative;overflow:hidden;cursor:pointer;animation:up .3s ease}
.rc-k,.rc-kick{font:700 12.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.rc-rule{width:40px;height:1.5px;background:var(--line);margin:0 0 20px}
.rc-h1{font:800 46px/1.05 var(--sans);letter-spacing:-.03em;color:var(--ink)}
.rc-h2{font:800 34px/1.1 var(--sans);letter-spacing:-.02em;margin-top:16px}
.rc-big{font:800 64px/1 var(--sans);letter-spacing:-.03em;background:linear-gradient(180deg,#E8925F,#C4572F);-webkit-background-clip:text;background-clip:text;color:transparent;padding:4px 0}
.rc-big.sm{font-size:50px}
.rc-sub{font:500 15px/1.45 var(--sans);color:var(--muted);margin-top:12px;max-width:300px}
.rc-tap{position:absolute;bottom:26px;left:0;right:0;font:500 13px var(--sans);color:var(--faint)}
.rc-ic{width:100px;height:100px;border-radius:50%;background:var(--accent-soft);color:var(--brand);display:grid;place-items:center}
.rc-lvl{width:120px;height:120px;border-radius:50%;background:var(--accent-soft);color:var(--brand);display:grid;place-items:center}
.rc-pips{display:flex;gap:8px;margin-top:22px}.rc-pips span{font:600 11px var(--sans);color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:6px}.rc-pips i{width:34px;height:6px;border-radius:6px;background:var(--line)}.rc-pips .on{color:var(--ink)}.rc-pips .on i{background:var(--brand)}
.rc-confetti{position:absolute;inset:18% 0 auto 0;height:30%;pointer-events:none}
.rc-confetti i{position:absolute;width:9px;height:12px;border-radius:2.5px;opacity:.85;animation:rcpop .6s ease both}
@keyframes rcpop{from{opacity:0;transform:scale(.3)}}
.dot.ms-done{border:0;cursor:pointer;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--brand)}

.sl-auto{font:500 11.5px/1.35 var(--sans);color:var(--muted);text-align:right;flex:none}
.dots-grid .dot{display:grid;place-items:center}
.said{color:#2E9E5B;font-weight:inherit}
.wk-verse .said,.verse .said{color:#4CC97E}
.ico{display:inline-flex;vertical-align:-3px;margin-right:6px}
.ico svg{display:block}
.sc-ic svg,.cloud-ic svg{display:block;margin:auto}
.pk-ic svg{display:block}
.goal-tick{vertical-align:-4px;margin-left:6px;flex:none}
.al-more{width:36px;height:30px;border:0;border-radius:15px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.al-more:active,.al-more[aria-expanded="true"]{background:var(--surface-2)}
.al-scrim{position:fixed;inset:0;z-index:30}
.al-menu{position:absolute;right:0;top:36px;z-index:31;min-width:250px;padding:6px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.28);animation:fade .15s ease}
.al-mi{display:flex;align-items:center;gap:16px;width:100%;padding:13px 18px;border:0;background:none;color:var(--ink);font:500 16px var(--sans);text-align:left;cursor:pointer}
.al-mi svg{color:var(--muted);flex:none}
.al-mi span{flex:1}
.al-mi:active{background:var(--surface-2)}
.al-mi .al-ok{color:var(--ink);display:inline-flex}
.al-mi .al-ok svg{color:var(--ink)}
.al-mi.danger,.al-mi.danger svg{color:#E5534B}
.al-mi:disabled{opacity:.4;cursor:default}
.al-sep{height:1px;background:var(--line);margin:4px 0}
.al-lbl{padding:8px 18px 4px;font:500 13.5px var(--sans);color:var(--muted)}
.h-sec h2{font:700 19px/1.2 var(--display);margin:0;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--muted);margin:-4px 2px 12px}
.label{font:700 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.link{border:none;background:none;color:var(--accent);font:600 13px var(--sans);padding:0}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font:600 14px var(--sans);border:1.5px solid transparent;transition:.15s}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-dashed{width:100%;background:transparent;border:1.5px dashed var(--line);color:var(--muted);border-radius:14px;padding:12px}
.btn-dashed:hover{border-color:var(--accent);color:var(--accent)}
.btn-block{width:100%}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:11px 13px;outline:none;transition:.15s;min-width:0}
.field:focus{border-color:var(--accent);background:var(--surface)}
.field-plain{border:none;background:transparent;outline:none;padding:0;min-width:0;width:100%}
/* Home */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:22px 22px 24px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 55%,transparent),transparent 70%);opacity:.55}
.hero .label{color:var(--accent-2)}
.hero p{font:500 21px/1.38 var(--display);margin:10px 0 0;position:relative;z-index:1}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.plan{display:flex;flex-direction:column}
.plan-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.plan-row:first-child{border-top:none}
.slot-badge{font:700 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:8px;flex:none;width:86px;text-align:center}
.s-Morning{background:var(--accent-soft);color:#A8441F}.s-Afternoon{background:var(--accent-soft);color:var(--accent)}.s-Night{background:#E3E4F3;color:#454C8F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .s-Morning{background:#3A2219;color:#F0A07E}:root:not([data-theme="light"]) .s-Night{background:#2C2C2E;color:#C7C7CC}}
:root[data-theme="dark"] .s-Morning{background:#3A2219;color:#F0A07E}:root[data-theme="dark"] .s-Night{background:#2C2C2E;color:#C7C7CC}
.theme-seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-3)}
.theme-seg button{border:none;background:transparent;border-radius:9px;padding:7px 12px;font:600 13px var(--sans);color:var(--muted)}
.theme-seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.plan-row .t{flex:1;min-width:0;font-weight:500}
.plan-row .tm{font-size:13px;color:var(--muted);white-space:nowrap}
.plan-row.done{opacity:.55}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px;border:1.5px dashed var(--line);border-radius:var(--r);background:transparent}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);cursor:pointer;border:1px solid var(--line);background:var(--surface-2);text-align:left;width:100%}
.banner .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--surface);color:var(--accent)}
.banner .tx{flex:1;font-size:13.5px;line-height:1.4}
.banner .tx b{display:block;font-size:14.5px;color:var(--ink)}
.banner.warn .ic{color:var(--warn)}
/* Courses */
.course{padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;position:relative}
.course::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--line)}
.course.d-hard::before{background:var(--hard)}.course.d-semi::before{background:var(--semi)}.course.d-easy::before{background:var(--easy)}
.course-top{display:flex;align-items:center;gap:8px;padding-left:6px}
.course-top .field-plain{font:700 17px/1.3 var(--display)}
.x{width:30px;height:30px;border-radius:50%;border:none;background:transparent;color:var(--faint);font-size:20px;line-height:1;flex:none;display:grid;place-items:center}
.x:hover{background:var(--surface-3);color:var(--hard)}
.grid3{display:grid;grid-template-columns:1.1fr .8fr .8fr;gap:8px;padding-left:6px}
.mini-label{font:600 10.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 4px 2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font:600 12px var(--sans);color:var(--muted);transition:.15s}
.seg button.on-hard{background:var(--hard-soft);border-color:var(--hard);color:var(--hard-ink)}
.seg button.on-semi{background:var(--semi-soft);border-color:var(--semi);color:var(--semi-ink)}
.seg button.on-easy{background:var(--easy-soft);border-color:var(--easy);color:var(--easy-ink)}
.ach{font:600 12px var(--sans);padding:4px 10px;border-radius:99px;align-self:center;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-2px 2px 12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.overall{display:flex;align-items:center;gap:18px;padding:20px;background:var(--hero);color:var(--hero-ink);border:none}
.pie{width:92px;height:92px;border-radius:50%;flex:none;display:grid;place-items:center}
.pie > div{width:70px;height:70px;border-radius:50%;background:var(--hero);display:grid;place-items:center;font:700 21px var(--display)}
.overall .label{color:var(--hero-muted)}
.overall .o-t{font:700 19px/1.25 var(--display);margin:4px 0}
.overall .o-s{font-size:13px;color:var(--hero-muted)}
.note{font-size:13px;color:var(--muted);padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line)}
/* Timetable */
.days{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 13px var(--sans);color:var(--muted);transition:.15s}
.day .dots{display:flex;gap:3px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.day .dots i.f{background:var(--accent)}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.on .dots i{background:color-mix(in srgb,var(--accent-ink) 35%,transparent)}.day.on .dots i.f{background:var(--accent-ink)}
.day.today:not(.on){border-color:var(--accent);color:var(--accent)}
.slot{padding:14px;display:flex;flex-direction:column;gap:10px}
.slot-head{display:flex;align-items:center;gap:10px}
.slot-head .rng{font-size:12px;line-height:1.35;color:var(--faint);flex:1;min-width:0}
.slot-head .slot-badge{width:auto}
.time{width:148px;flex:none;text-align:center;font-weight:600;padding:10px 8px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.row-actions .btn{flex:1;padding:11px 12px;font-size:13px}
/* Streak */
.dots-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.dot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:600 10px var(--sans);border:1.5px solid var(--line);background:var(--surface-2);color:var(--faint);padding:0}
.dot.f{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.tgt{border-style:dashed;border-color:var(--accent);color:var(--accent);background:var(--accent-soft);animation:pulse 1.8s ease-in-out infinite}
.dot.ms{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--brand)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 35%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.list{display:flex;flex-direction:column}
.list > div{display:flex;gap:14px;padding:14px 16px;border-top:1px solid var(--line);align-items:flex-start}
.list > div:first-child{border-top:none}
.list .num{font:700 13px var(--display);color:var(--accent);width:22px;flex:none;padding-top:1px}
.list p{margin:0;font-size:14px;line-height:1.5}
.list .rw{margin-left:auto;color:var(--muted);font-size:13.5px;text-align:right}
/* Settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.set-row:first-child{border-top:none}
.set-row .k{font-weight:600}
.set-row .k small{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.set-row input.field-plain{text-align:right;font:600 15px var(--display)}
.switch{width:50px;height:30px;border-radius:99px;border:none;position:relative;background:var(--surface-3);flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch.on{background:var(--accent)}
[data-theme="dark"] .switch.on{background:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .switch.on{background:var(--brand)}}
.switch.on::after{left:23px}
.help{font-size:12.5px;line-height:1.55;color:var(--muted);margin:12px 2px 0}
.help b{color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:10px}
/* Overlays */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,#120D09 72%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s ease}
.alarm{width:100%;max-width:380px;text-align:center;background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:34px 24px 24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.bell{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;position:relative}
.bell::before,.bell::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ring 1.6s ease-out infinite}
.bell::after{animation-delay:.8s}
.bell svg{width:44px;height:44px;animation:shake 1s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}75%{transform:rotate(0)}}
.alarm .clock{font:700 46px/1 var(--display);letter-spacing:-.02em}
.alarm h3{font:700 20px/1.3 var(--display);margin:12px 0 4px}
.alarm p{margin:0 0 24px;color:var(--hero-muted);font-size:14px}
.alarm .btn{width:100%}
.alarm .btn-ghost{color:var(--hero-ink);border-color:rgba(255,255,255,.18);margin-top:10px}
.medal{width:130px;height:130px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F3B496,#C4572F 60%,#8A3517);display:grid;place-items:center;font:700 50px var(--display);color:#5A3608;box-shadow:0 0 0 8px rgba(247,216,138,.25),0 20px 50px -10px rgba(217,152,46,.6)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font:600 13.5px var(--sans);box-shadow:var(--shadow);animation:fade .2s ease;max-width:calc(100% - 32px);text-align:center}
/* alarms tab */
.btn-sm{padding:8px 14px;font-size:13px;border-radius:11px}
.perm{border-color:color-mix(in srgb,var(--hard) 40%,var(--line))}
.perm-head{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 8px;color:var(--hard)}
.perm-head b{display:block;color:var(--ink);font-size:15px}.perm-head span{font-size:13px;color:var(--muted)}
.link.danger{color:var(--hard)}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.opt-row .k{font-weight:600;font-size:14px}
.stepper{display:flex;align-items:center;gap:6px;background:var(--surface-3);border-radius:12px;padding:4px}
.stepper button{width:34px;height:32px;border:none;border-radius:9px;background:var(--surface);font:600 18px var(--sans);color:var(--ink)}
.stepper b{min-width:22px;text-align:center}
.qcard{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.q-top{display:flex;align-items:center;gap:8px}
.q-q{font:700 15.5px/1.35 var(--display)}
.q-row{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
/* mission overlay */
.overlay{overflow-y:auto}
.alarm.has-mission{padding-top:24px}
.alarm.has-mission .bell{width:64px;height:64px;margin-bottom:12px}
.alarm.has-mission .bell svg{width:30px;height:30px}
.alarm.has-mission .clock{font-size:34px}
.alarm.has-mission h3{margin:8px 0 14px;font-size:18px}
.mprog{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.mprog i{width:30px;height:5px;border-radius:9px;background:rgba(255,255,255,.16)}
.mprog i.f{background:var(--good)}.mprog i.c{background:var(--accent-2)}
.mlabel{font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--hero-muted);margin-bottom:12px}
.mbox{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:18px 16px 14px;margin-bottom:12px}
.mcourse{display:inline-block;font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-2);background:rgba(255,255,255,.07);padding:4px 10px;border-radius:99px;margin-bottom:8px}
.mq{font:700 32px/1.2 var(--display);margin:2px 0 14px;word-break:break-word}
.mq.small{font-size:20px;font-weight:600;line-height:1.35}
.alarm .mq,.alarm .letters,.alarm .verse{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mi{width:100%;text-align:center;font:600 22px var(--sans);padding:13px;border-radius:14px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:var(--hero-ink);outline:none;margin-bottom:10px}
.mi:focus{border-color:var(--accent-2)}
.mi::placeholder{color:rgba(255,255,255,.35);font-weight:500;font-size:16px}
.mbox .btn{width:100%}
.mmsg{min-height:18px;font-size:13.5px;color:#F3A48A;margin-top:10px;line-height:1.4}
.mmsg:empty{display:none}
.mhint{color:var(--hero-muted);margin:12px 0!important;font-size:14px}
.shake-ring{width:150px;height:150px;border-radius:50%;margin:0 auto;display:grid;place-items:center}
.shake-ring > div{width:122px;height:122px;border-radius:50%;background:var(--hero);display:flex;flex-direction:column;align-items:center;justify-content:center}
.shake-n{font:700 46px/1 var(--display)}
.shake-ring small{color:var(--hero-muted);font-size:12px;margin-top:4px}
.mbox .btn-ghost{margin-top:10px}
.wobble{animation:wobble .5s cubic-bezier(.36,.07,.19,.97)!important}
@keyframes wobble{0%,100%{transform:translateX(0)}10%,90%{transform:translateX(-4px)}20%,80%{transform:translateX(8px)}30%,50%,70%{transform:translateX(-14px)}40%,60%{transform:translateX(14px)}}
.mbox.wrong{border-color:#E5534B;background:rgba(229,83,75,.14);transition:background .6s}
.mbox.wrong .mi{border-color:#E5534B}
.mbox.right{border-color:#5FB35A;background:rgba(95,179,90,.18);transition:background .2s}
.mmsg.bad{color:#FF8A80;font-weight:600}
.alarm-mode .app{display:none}
.alarm-mode .overlay{background:var(--hero);backdrop-filter:none;-webkit-backdrop-filter:none;padding:calc(20px + env(safe-area-inset-top)) 18px 20px}
.alarm-mode .alarm{box-shadow:none;max-width:440px;padding-left:4px;padding-right:4px}
.alarm-mode .toast{display:none}
/* v5: alarm list, sheets, missions, onboarding */
.chev{font-size:24px;line-height:1;color:var(--faint);margin-left:auto;flex:none}
.row-btn{width:100%;background:none;border:none;border-top:1px solid var(--line);text-align:left;cursor:pointer}
.card > .row-btn:first-child{border-top:none}
.row-btn:hover{background:var(--surface-2)}
.next-alarm{padding:18px 20px}
.na-time{font:700 40px/1.05 var(--display);margin-top:6px;position:relative;z-index:1}
.na-sub{color:var(--hero-muted);font-size:13.5px;margin-top:4px;position:relative;z-index:1}
.alarm-row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;transition:.15s}
.alarm-row:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.alarm-row.off{opacity:.55}
.ar-main{flex:1;min-width:0}
.ar-time{font:700 34px/1.05 var(--display);letter-spacing:-.02em}
.ar-time small{font:600 15px var(--sans);color:var(--muted);letter-spacing:0}
.ar-sub{font-size:13px;color:var(--muted);margin:3px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--sans);padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.big-empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 20px}
.big-empty .ee-ic{font-size:34px}.big-empty b{color:var(--ink);font-size:16px}
body.focus-open #sheet .sheet-wrap{z-index:48}
#sheet .sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(18,13,9,.5)}
.sheet-bg.in{animation:fade .2s ease}
.f-sug{display:flex;flex-direction:column;gap:6px;margin-top:8px}.f-sug:empty{display:none}
.f-sug-it{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:left;animation:fade .15s ease}
.f-sug-it b{font-weight:700;font-size:15px}.f-sug-it span{color:var(--muted);font-size:13px}
.f-sug-it:active{background:var(--accent-soft)}
.emg{margin-top:18px;padding:14px;border-radius:16px;background:rgba(214,69,69,.08);border:1px solid rgba(214,69,69,.25);display:flex;flex-direction:column;gap:12px}
.emg.used{color:var(--muted);font-size:13.5px;background:var(--surface-2);border-color:var(--line)}
.emg-tx b{display:block;font-size:15px;margin-bottom:3px}.emg-tx span{font-size:13px;color:var(--muted);line-height:1.45}
.exit-phrase{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.emg-btn{position:relative;overflow:hidden;height:50px;border-radius:14px;border:none;background:#D64545;color:#fff;font:700 15px var(--sans);touch-action:none;user-select:none;-webkit-user-select:none}
.emg-btn i{position:absolute;inset:0;width:0;background:rgba(0,0,0,.28)}.emg-btn span{position:relative}
.emg-btn.holding i{width:100%;transition:width 5s linear}
.ask-wrap{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:24px}
.ask-bg{position:absolute;inset:0;background:rgba(18,13,9,.5);animation:fade .18s ease}
.ask{position:relative;width:100%;max-width:340px;background:var(--surface);color:var(--ink);border-radius:22px;padding:22px 20px 16px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:askIn .22s cubic-bezier(.2,1.2,.4,1)}
.ask b{display:block;font-size:18px;font-weight:800;margin-bottom:6px}
.ask p{margin:0 0 18px;color:var(--muted);font-size:14.5px;line-height:1.5}
.ask-btns{display:flex;gap:10px;justify-content:flex-end}.ask-btns .btn{flex:1;justify-content:center}
.btn-danger{background:#D64545;color:#fff;border:none}
.ask-wrap.out{opacity:0;transition:opacity .16s ease}
@keyframes askIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom)}
.sheet.in{animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:700px){#sheet .sheet-wrap{align-items:center}.sheet{border-radius:24px;max-height:86vh}}
.sheet-head{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:8px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.sheet-head b{font:700 17px var(--display);text-align:center;min-width:0}
.sheet-head .link{width:52px;text-align:left}
.sheet-body{overflow-y:auto;padding:16px 18px 8px;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:10px 18px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:center}
body.sheet-open{overflow:hidden}
.sh-time{text-align:center;margin:4px 0 8px}
.sh-time input{font:700 52px/1.1 var(--display);border:none;background:transparent;color:var(--ink);text-align:center;outline:none;padding:4px;letter-spacing:-.02em;max-width:100%}
.sh-sec{margin-top:18px}
.sh-label{font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 2px 8px;display:block}
.wdays{display:flex;gap:6px;justify-content:space-between}
.wdays button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font:700 13px var(--sans);color:var(--muted);padding:0;flex:none}
.wdays button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.presets{display:flex;gap:6px;margin-top:10px}
.presets button{flex:1;border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:7px 4px;font:600 12px var(--sans);color:var(--muted)}
.presets button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mopt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 10px;transition:.15s;min-width:0}
.mopt .mo-ic{font-size:22px;flex:none;width:28px;text-align:center}
.mopt .mo-tx{min-width:0}.mopt b{display:block;font-size:13.5px}.mopt small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.mopt.on{border-color:var(--accent);background:var(--accent-soft)}
.warn-note{margin-top:10px}
.del-btn{margin-top:22px;background:transparent;border:1.5px solid color-mix(in srgb,var(--hard) 40%,var(--line));color:var(--hard)}
textarea.field{resize:vertical;font:inherit;line-height:1.5}
.wsteps{display:flex;gap:6px;justify-content:center;margin:4px 0 6px}
.wsteps i{width:26px;height:5px;border-radius:9px;background:var(--surface-3)}
.wsteps i.on{background:var(--accent)}
.welcome{text-align:center;padding:8px 4px 6px}
.welcome .w-ic{font-size:44px;margin-bottom:6px}
.welcome h2{font:700 25px/1.2 var(--display);margin:0 0 8px}
.welcome p{color:var(--muted);margin:0 0 18px;font-size:14.5px}
.welcome .sh-label{text-align:left}
.skip{color:var(--muted)!important;padding:6px!important}
/* mission extras */
.link-light{border:none;background:none;color:var(--hero-muted);font:600 13px var(--sans);margin-top:12px;text-decoration:underline;text-underline-offset:3px}
.mic{width:100%;font-size:15px;padding:16px}
.mic.on{animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(232,146,95,.5)}50%{box-shadow:0 0 0 10px rgba(232,146,95,0)}}
.affirm{font-style:italic}
.verse{font:500 18px/1.5 var(--display);margin:2px 0 8px}
.verse .blank{color:var(--accent-2);letter-spacing:.05em}
.nlt-tag{display:inline-block;font:700 11.5px var(--sans);letter-spacing:.04em;color:#3DBE6B;background:rgba(61,190,107,.14);border-radius:99px;padding:5px 10px;margin-bottom:10px;animation:fade .3s ease}
.nlt-credit{font:500 10.5px var(--sans);color:var(--hero-muted);opacity:.75;margin:-6px 0 10px}
.vref{font:700 11.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--hero-muted);margin-bottom:12px}
.mhint2{font-size:12.5px;color:var(--accent-2);margin:-4px 0 10px}
.mem{font:700 46px/1 var(--display);letter-spacing:.06em;margin:8px 0 14px;display:flex;justify-content:center;gap:2px}
.mem span{width:4px}
.membar{height:5px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.membar i{display:block;height:100%;background:var(--accent-2);animation:drain linear forwards}
@keyframes drain{from{width:100%}to{width:0}}
.tiles{display:grid;gap:8px}
.tile{aspect-ratio:1;border-radius:14px;border:none;background:rgba(255,255,255,.1);color:var(--hero-ink);font:700 22px var(--display);transition:transform .08s}
.tile:active{transform:scale(.94)}
.tile.done{background:color-mix(in srgb,var(--good) 45%,transparent);color:rgba(255,255,255,.6)}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 16px}
.letters span{width:36px;height:42px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;font:700 20px var(--display)}
body.sheet-open .toast{bottom:auto;top:calc(16px + env(safe-area-inset-top))}
.greet-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 2px}
.greet-row h1{font:700 26px/1.15 var(--display);letter-spacing:-.02em;margin:0}
.greet-row .date{font-size:13px;color:var(--muted)}

/* ===== v7: clean home, focus mode, progress ===== */
.hero.focus-quote{padding:18px 20px 20px}
.hero.focus-quote p{font-size:19px;font-weight:700;letter-spacing:-.005em}
.study-card{padding:16px 18px;text-align:left;width:100%;display:block}
.study-card .sc-row{display:flex;align-items:center;gap:12px}
.study-card .sc-tx{flex:1;min-width:0}
.study-card .sc-tx b{display:block;font:700 26px/1.1 var(--display);margin-top:4px}
.study-card .sc-tx b small{font:500 14px var(--sans);color:var(--muted)}
.study-card .btn{padding:12px 16px;white-space:nowrap}
.study-card.live{display:flex;align-items:center;gap:14px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.study-card.live .sc-ic{font-size:26px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--surface);flex:none}
.study-card.live .sc-tx b{font-size:19px}
.study-card.live .sc-tx span{font:600 14px var(--sans);color:var(--accent);font-variant-numeric:tabular-nums}
.exams{padding:4px 0}
.ex-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line)}
.ex-row:first-child{border-top:none}
.ex-d{width:52px;flex:none;text-align:center;border-radius:12px;background:var(--surface-3);padding:6px 0;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);line-height:1.1}

/* progress */

/* One button colour across the app: black buttons and selected options (white in Dark mode).
   Orange-brown stays for links, ticks, switches and progress. Dark screens (study timer, ringing alarm) keep orange buttons. */

.theme-seg button.on,.lvl-seg button.on{background:var(--btn);color:var(--btn-ink);box-shadow:none}

.focus-screen .btn-primary,.overlay .btn-primary,.hero .btn-primary{background:var(--brand);color:#fff}

/* account screens */
body.auth-open .app,body.auth-open #fab{display:none!important}
.auth{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.auth-in-wrap{min-height:100%;max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 26px);display:flex;flex-direction:column;position:relative}
.auth-start{justify-content:space-between}
.auth-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 0 24px}
.auth-logo{width:96px;height:96px;border-radius:28px;background:linear-gradient(160deg,#F2A06B,#C4572F);display:grid;place-items:center;margin-bottom:22px;box-shadow:0 14px 34px rgba(196,87,47,.28)}
.auth-logo svg{width:62px;height:62px}
.auth-hero h1{font:700 34px/1.1 var(--display);margin:0 0 10px;letter-spacing:-.01em}
.auth-hero p{color:var(--muted);font-size:15.5px;line-height:1.55;margin:0}
.auth-actions{display:flex;flex-direction:column;gap:12px}
.auth .btn-block{padding:15px 18px;font-size:15px;border-radius:16px}
.auth-g{background:var(--surface);border:1.5px solid var(--line)!important;color:var(--ink)}
.auth-g svg{flex:0 0 auto}
.auth-alt{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 0}
.auth-alt .link{font-size:14px}
.auth-back{align-self:flex-start;width:42px;height:42px;border-radius:50%;border:none;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;margin-bottom:14px}
.auth-form h2{font:700 28px/1.15 var(--display);margin:6px 0 8px}
.auth-sub{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0 0 20px}
.auth-lbl{display:block;font:600 13px var(--sans);color:var(--ink-2,var(--ink));margin:14px 2px 7px}
.auth .field{padding:14px 14px;font-size:16px;border-radius:14px}
.auth-pw{position:relative}
.auth-pw .field{padding-right:68px}
.auth-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--accent);font:600 13px var(--sans);padding:8px}
.auth-forgot{text-align:right;margin:10px 2px 0}
.auth-go{margin-top:22px}
.auth-or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12.5px;margin:18px 0}
.auth-or:before,.auth-or:after{content:"";flex:1;height:1px;background:var(--line)}
.auth-err{background:rgba(220,60,50,.1);color:#D03B30;border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.45;margin:0 0 6px}
.auth-ok{background:rgba(40,160,90,.12);color:#1F8A4C;border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.45;margin:0 0 6px}
[data-theme="dark"] .auth-err{color:#FF7A70}[data-theme="dark"] .auth-ok{color:#5BD08A}
.auth .btn[disabled]{opacity:.6}
.acct-row{border-top:none!important}
.acct-av{width:42px;height:42px;border-radius:50%;background:var(--accent-2,#F08A5D);color:#fff;display:grid;place-items:center;font:700 18px var(--sans);flex:0 0 auto}
.acct-row .k{flex:1}
.danger-tx{color:#D03B30}
.cloud-ic{font-size:44px;text-align:center;margin:4px 0 8px}
.cloud-opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;color:var(--ink)}
.cloud-opt b{display:block;font:600 15px var(--sans);margin-bottom:3px}
.cloud-opt small{color:var(--muted);font-size:13px}
.cloud-opt:first-of-type{border-color:var(--accent)}

/* ---- Wayk-style mission screens ---- */
.wk-screen{background:#000!important;padding:0!important;display:block!important;animation:none!important}
.wk{min-height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px);color:#fff;text-align:center;-webkit-user-select:none;user-select:none}
.wk-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.wk-x,.wk-x-sp{width:44px;height:44px;flex:none}
.wk-x{border-radius:50%;border:1px solid #2C2C2E;background:#161618;color:#C9C9CE;display:grid;place-items:center}
.wk-brand{font:800 34px/1 var(--sans);letter-spacing:-.02em}
.wk-dots{display:flex;gap:7px;justify-content:center;align-items:center;margin:0 0 14px}
.wk-dots i{width:7px;height:7px;border-radius:99px;background:#3A3A3C;transition:width .25s}
.wk-dots i.c{width:28px;background:#E8925F}.wk-dots i.f{background:#5FB35A}
.wk-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 0}
.wk-cap2{font:500 15px var(--sans);color:#A5A5AB;margin-bottom:10px}
.wk-q{font:700 54px/1.1 var(--sans);letter-spacing:-.01em;margin:0 0 26px;word-break:break-word}
.wk-q.sm{font-size:24px;line-height:1.3;font-weight:700;max-width:340px}
.wk-q.xs{font-size:21px;line-height:1.4;font-weight:600;max-width:340px}
.wk-mem{letter-spacing:.12em}
.wk-box{min-width:170px;max-width:90%;height:64px;padding:0 22px;border-radius:20px;display:grid;place-items:center;font:700 32px var(--sans);background:#111113;border:2px solid transparent;
  background-image:linear-gradient(#111113,#111113),linear-gradient(180deg,#F2A06B,#C4572F);background-origin:border-box;background-clip:padding-box,border-box;box-shadow:0 0 24px rgba(196,87,47,.30)}
.wk-box.empty{color:#55555A}
.wk-mid.bad .wk-box,.wk-mid.bad .wk-in{animation:wobble .45s}
.wk-mid.bad .wk-box{background-image:linear-gradient(#1A0F0F,#1A0F0F),linear-gradient(180deg,#E5534B,#E5534B)}
.wk-mid.good .wk-box{background-image:linear-gradient(#0F1A10,#0F1A10),linear-gradient(180deg,#5FB35A,#5FB35A)}
.wk-msg{min-height:20px;margin-top:14px;font:500 14px/1.4 var(--sans);color:#A5A5AB;max-width:320px}
.wk-msg.bad{color:#FF8A80;font-weight:600}
.wk-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.wk-key{height:62px;border-radius:18px;background:#111113;border:1px solid #232326;color:#fff;font:600 26px var(--sans);display:grid;place-items:center;transition:transform .06s,background .1s}
.wk-key:active{transform:scale(.96);background:#1E1E21}
.wk-key.ok{color:#55555A}.wk-key.ok.on{color:#fff;background:#C4572F;border-color:#C4572F}
.wk-form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.wk-in{height:60px;border-radius:20px;text-align:center;font:600 20px var(--sans);color:#fff;outline:none;border:2px solid transparent;-webkit-user-select:text;user-select:text;
  background-image:linear-gradient(#111113,#111113),linear-gradient(180deg,#F2A06B,#C4572F);background-origin:border-box;background-clip:padding-box,border-box;box-shadow:0 0 24px rgba(196,87,47,.28)}
.wk-in::placeholder{color:#55555A;font-weight:500}
.wk-pill{height:54px;border-radius:18px;border:none;background:#C4572F;color:#fff;font:700 16px var(--sans);padding:0 24px}
.wk-link{border:none;background:none;color:#8E8E93;font:500 13.5px var(--sans);text-decoration:underline;text-underline-offset:3px;margin-top:12px}
.wk-letters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 24px}
.wk-letters span{width:44px;height:52px;border-radius:14px;background:#111113;border:1px solid #2C2C2E;display:grid;place-items:center;font:700 24px var(--sans);text-transform:uppercase}
.wk-opts{width:100%;max-width:380px;display:grid;gap:10px}
.wk-opt{min-height:58px;border-radius:18px;background:#111113;border:1px solid #2C2C2E;color:#fff;font:600 16px var(--sans);padding:12px 18px;text-align:center}
.wk-opt:active{background:#1E1E21}.wk-opt.ok{border-color:#5FB35A;background:#0F1A10}
.wk-tiles{width:100%;max-width:360px;display:grid;gap:10px}
.wk-tile{aspect-ratio:1;border-radius:18px;background:#111113;border:1px solid #2C2C2E;color:#fff;font:700 24px var(--sans)}
.wk-tile:active{transform:scale(.95)}.wk-tile.done{background:#2A150D;border-color:#7A4430;color:#E8925F}
.wk-bar{width:180px;height:4px;border-radius:9px;background:#1C1C1E;overflow:hidden}.wk-bar i{display:block;height:100%;background:#C4572F;animation:drain linear forwards}
.wk-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border-radius:30px;background:#18181A;border:1px solid #7A4430;box-shadow:0 0 50px rgba(196,87,47,.14);padding:56px 22px 26px;margin-bottom:22px}
.wk-card.bad{border-color:#E5534B;animation:wobble .45s}.wk-card.good{border-color:#5FB35A}
.wk-ref{position:absolute;top:22px;left:0;right:0;font:700 14px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#E8925F}
.wk-tag{font:700 12px var(--sans);color:#5FB35A;background:rgba(95,179,90,.14);border-radius:99px;padding:6px 12px;margin-bottom:18px}
.wk-verse{font:500 25px/1.5 var(--sans);color:#E5E5EA;max-width:360px}
.wk-credit{font:500 11px var(--sans);color:#636366;margin-top:16px}
.wk-card .wk-msg{position:absolute;bottom:18px;left:18px;right:18px;margin:0}
.wk-micwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.wk-mic{width:96px;height:96px;border-radius:50%;background:linear-gradient(160deg,#F2A06B,#C4572F);color:#fff;border:none;display:grid;place-items:center;box-shadow:0 0 0 6px #000,0 0 0 9px #C4572F,0 0 44px rgba(196,87,47,.45);transition:transform .1s}
.wk-mic:active{transform:scale(.95)}.wk-mic.on{animation:wkpulse 1.2s ease-in-out infinite;background:linear-gradient(160deg,#F7B88A,#D9683A)}
@keyframes wkpulse{0%,100%{box-shadow:0 0 0 6px #000,0 0 0 9px #C4572F,0 0 30px rgba(196,87,47,.35)}50%{box-shadow:0 0 0 6px #000,0 0 0 14px #E8925F,0 0 60px rgba(232,146,95,.6)}}
.wk-cap{font:500 15px var(--sans);color:#A5A5AB}
.wk .shake-ring > div{background:#000}
/* ring screens */
.overlay.ring{background:#000;padding:0;place-items:stretch;backdrop-filter:none;-webkit-backdrop-filter:none;color:#fff}
.overlay.ring.task{display:block;padding:calc(env(safe-area-inset-top) + 20px) 18px 24px}
.overlay.ring.task .alarm{background:transparent;box-shadow:none;margin:0 auto;padding-top:10px}
.overlay.ring.task .bell{display:none}
.overlay.ring.task .clock{font-size:38px}
.ring-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 26px);max-width:460px;margin:0 auto;width:100%}
.ring-brand{font:700 26px var(--display);letter-spacing:-.01em}
.ring-clock{font:600 15px var(--sans);color:#9A9AA0;margin-top:6px}
.ring-title{font-size:14px;color:#9A9AA0;margin-top:2px;min-height:18px}
.ring-mid{display:flex;flex-direction:column;align-items:center;gap:18px}
.ring-msg{font:600 27px/1.25 var(--sans);color:#A5A5AB;max-width:330px}
.ring-msg b{color:#fff;font-weight:700}
.ring-sub{color:#A5A5AB;font-size:15px;margin-top:-6px}
.ring-bot{width:100%;display:flex;flex-direction:column;gap:10px}
.ring-btn{width:100%;background:#fff;color:#000;border-radius:18px;padding:17px;font-size:16px}
.ring-ghost{width:100%;background:transparent;color:#C9C9CE;border:1.5px solid #2C2C2E!important;border-radius:18px;padding:14px}
.mascot{animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 30px rgba(249,170,70,.25))}
.mascot.happy{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both, bob 3.2s ease-in-out .5s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.mascot,.mascot.happy{animation:none}}
.qopts{display:grid;gap:8px;margin-top:14px}
.qopt{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:13px 14px;font:600 15px var(--sans);text-align:left}
.qopt:active{background:rgba(255,255,255,.16)}
.qopt.ok{border-color:#5FB35A;background:rgba(95,179,90,.25)}
/* mission chooser */
.mchips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px 2px;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{flex:none;border:none;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:9px 15px;font:600 13.5px var(--sans)}
.mchip.on{background:var(--ink);color:var(--bg)}
.mcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px 10px 12px;cursor:pointer;min-width:0}
.mcard.on{border-color:var(--btn)}
.mc-ic{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:27px;margin-bottom:6px}
.mc-ic.sm{width:38px;height:38px;font-size:19px;margin:0}
.mission-icon{display:inline-block;width:1em;height:1em;vertical-align:-.15em;flex:none;pointer-events:none;overflow:visible}
.mc-ic .mission-icon{width:32px;height:32px;vertical-align:0}
.ml-ic .mission-icon{width:22px;height:22px;vertical-align:middle;color:var(--muted)!important}
.mc-ic.sm .mission-icon{width:23px;height:23px}
.mcard b{font-size:15px}
.mcard small{font-size:12px;color:var(--muted);line-height:1.35;min-height:32px}
.mc-prev{margin-top:6px;border:none;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:6px 14px;font:600 12px var(--sans)}
.mcheck{position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.mpanel{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.mp-grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin-bottom:2px}
.mp-title{font:700 17px var(--sans)}
.mp-k{font-size:13px;color:var(--muted);margin-top:2px}
.bigstep{display:flex;align-items:center;gap:30px}
.bigstep button{width:46px;height:46px;border-radius:50%;border:none;background:var(--ink);color:var(--bg);font:700 24px var(--sans);display:grid;place-items:center}
.bigstep span{font:700 40px var(--sans);min-width:56px;text-align:center}
.lvl-seg{display:flex;width:100%;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.lvl-seg button{flex:1;border:none;background:transparent;color:var(--ink);border-radius:11px;padding:11px 6px;font:600 14px var(--sans)}
.lvl-seg button.on{background:var(--btn);color:var(--btn-ink)}
.mp-pack{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font:600 14px var(--sans);color:var(--ink)}
.mp-pack em{font-style:normal;color:var(--muted);font-weight:500;font-size:13px}
.mp-note{font-size:12.5px;color:var(--muted);margin:0}
/* packs */
.pk-top{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px;font:700 11.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pk-top .warn{color:var(--brand);text-transform:none;letter-spacing:0;font-size:13.5px}
.pk-top .link{text-transform:none;letter-spacing:0}
.pk-list{display:flex;flex-direction:column;gap:10px}
.pk-row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:13px 14px;color:var(--ink)}
.pk-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.pk-tx{flex:1;min-width:0}.pk-tx b{display:block;font-size:15px}.pk-tx small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.pk-ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#000}
.pk-row.on .pk-ck{background:var(--brand);border-color:var(--brand)}
.pk-row:not(.on){opacity:.7}
.pool-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pool-it{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 8px;color:var(--ink);font-size:13.5px}
.pool-it:not(.on){opacity:.55}
.pool-it.on{border-color:var(--brand)}
.btn-gold{background:var(--brand);color:var(--brand-ink)}
/* wake-up check sheet */
.ck-row{display:flex;gap:14px;align-items:flex-start;margin:0 0 16px}
.ck-ic{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink)}
.ck-row b{display:block;font-size:15px;margin-bottom:3px}.ck-row small{color:var(--muted);font-size:13px;line-height:1.45}
/* settings */
.srow{gap:12px}
.s-ic{width:24px;display:grid;place-items:center;color:var(--muted);flex:none}
.srow .k{flex:1}
.s-line{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.s-line .k{flex:1}
.dot-warn{background:#E5534B;color:#fff;border-radius:999px;font:700 11px var(--sans);padding:2px 7px}
.ver{text-align:center;color:var(--faint);font-size:12.5px;line-height:1.7;margin:22px 0 8px}
.acct-av.sm{width:30px;height:30px;font-size:14px}
.acct-head{display:flex;flex-direction:column;align-items:center;gap:4px;margin:4px 0 18px;text-align:center}
.acct-head .acct-av{width:64px;height:64px;font-size:26px;margin-bottom:6px}
.acct-head b{font-size:17px}.acct-head small{color:var(--muted)}
.help-card{display:flex;gap:12px;padding:14px 16px}
.ok-tick{width:24px;height:24px;border-radius:50%;border:2px solid #34C77B;color:#34C77B;display:grid;place-items:center;flex:none}
.help-card p{margin:0 0 8px;color:var(--muted);font-size:13.5px;line-height:1.5}.help-card p:last-child{margin:0}
.vol{width:100%;accent-color:var(--brand)}
.legal h4{font:700 15px var(--sans);margin:18px 0 6px}
.legal p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 8px}

.nice-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 18px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.nice-empty .mascot{animation:none;filter:none;margin-bottom:4px}
.nice-empty b{font-size:17px}.nice-empty span{color:var(--muted);font-size:14px;max-width:280px;line-height:1.5}
.nice-empty .btn{margin-top:8px}
.coach{position:fixed;inset:0;z-index:58}
.co-block{position:absolute;inset:0}
.co-dim{position:absolute;inset:0;background:rgba(14,10,7,.62)}
.co-spot{position:absolute;box-shadow:0 0 0 9999px rgba(14,10,7,.62);pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1);outline:2px solid rgba(255,255,255,.85);outline-offset:2px}
.co-tip{position:absolute;background:var(--surface);color:var(--ink);border-radius:18px;padding:16px 16px 12px;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:coIn .28s cubic-bezier(.2,.8,.2,1);box-sizing:border-box}
@keyframes coIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1}}
.co-tip>b{display:block;font:700 16px var(--sans);margin-bottom:4px}
.co-tip p b{color:var(--ink)}
.co-tip p{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.5}
.co-art{display:flex;justify-content:center;margin:-2px 0 6px}
.co-art .mascot{animation:none;filter:none}
.co-row{display:flex;align-items:center;gap:12px}
.co-step{flex:1;font-size:12.5px;color:var(--faint);font-weight:600}
.co-arrow{position:absolute;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent}
.co-arrow.up{top:-8px;border-bottom:8px solid var(--surface)}
.co-arrow.down{bottom:-8px;border-top:8px solid var(--surface)}
@media (prefers-reduced-motion:reduce){.co-spot,.co-tip{transition:none;animation:none}}

/* launch screen: the app's own background, the logo, and the loader right under it */
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
.sp-center{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:-30px}
.sp-logo{width:104px;height:104px;border-radius:30px;background:linear-gradient(160deg,#F2A06B,#C4572F);display:grid;place-items:center;box-shadow:0 14px 34px -10px rgba(196,87,47,.55);animation:spPop .45s ease-out both}
.sp-bar{width:84px;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.sp-bar i{display:block;width:40%;height:100%;border-radius:99px;background:linear-gradient(90deg,#F2A06B,#C4572F);animation:spLoad 1s ease-in-out infinite}
@keyframes spPop{0%{transform:scale(.5)}60%{transform:scale(1.1)}80%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes spLoad{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important;opacity:1!important;transform:none!important}}

function migrateV3(o){
  const s=defaults();
  ['name','semester','year','tt','ttTime','streakCount','lastCheckin','longest','reminderOn'].forEach(k=>{if(o[k]!=null)s[k]=o[k];});
  const inList=(list,t)=>(list||[]).map(norm).includes(norm(t));
  const prog={};(o.progress||[]).forEach(p=>{if(norm(p.code))prog[norm(p.code)]=p.exam||'';});
  if(Array.isArray(o.courses)&&o.courses.length){
    s.courses=o.courses.map(c=>({id:uid(),code:c.code||'',title:c.title||'',goal:c.goal||'',grade:prog[norm(c.code)]||'',exam:'',
      diff:!norm(c.title)?'':inList(o.hard,c.title)?'hard':inList(o.semi,c.title)?'semi':inList(o.easy,c.title)?'easy':''}));
  }
  return s;
}
function load(){
  try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.courses)return Object.assign(defaults(),v,{activeTab:'home',selectedDay:todayShort()});}catch(e){}

}

  if(!Array.isArray(S.wakeAlarms))S.wakeAlarms=[];

  S.wakeAlarms=S.wakeAlarms.map(a=>normAlarm(a));
  S.wakeAlarms.forEach(a=>{if(a.repeat==='once'&&a.on&&a.onceAt&&Date.now()>a.onceAt+60000)a.on=false;});

  delete S.studyDur;

})();

/* The name you saved, in full (e.g. "Big Daddy"), for greetings and spoken alerts. */
function callName(){return (S&&S.name||'').trim().replace(/\s+/g,' ');}
function streakInfo(){
  const t=todayISO(),y=addDays(t,-1);
  // Your streak only grows: a day is added automatically when you reach a study goal, and missing a day never resets it.
  const count=S.streakCount||0;
  let level='Rising';for(const L of LEVELS){if(count>=L.at)level=L.name;}
  const nxt=LEVELS.find(L=>count<L.at),nextAt=nxt?nxt.at:null;
  const prevAt=[0,...LEVELS.map(l=>l.at)].filter(a=>a<=count).pop();
  return {count,checked:S.lastCheckin===t,level,nextAt,
    nextLabel:nextAt===null?'Top level reached':(nextAt-count)+(nextAt-count===1?' day':' days')+' to '+nxt.name,
    pct:nextAt===null?100:Math.round((count-prevAt)/(nextAt-prevAt)*100)};
}
function gradeInfo(){
  const withGoal=S.courses.filter(c=>norm(c.title)||norm(c.code)).filter(c=>gradeVal(c.goal)!=null);
  let sum=0,n=0,missing=0;
  withGoal.forEach(c=>{const g=gradeVal(c.goal),e=gradeVal(c.grade);if(g>0&&e!=null){sum+=Math.min(100,e/g*100);n++;}else missing++;});
  const pct=n?Math.round(sum/n):0;
  let label='',color='var(--accent)';
  if(pct>=100){label='Goals met — outstanding work.';color='#5FB35A';}
  else if(pct>=85){label='So close to your goals.';color='#E39A7C';}
  else if(pct>=70){label='Solid — keep pushing.';color='#D9825B';}
  else{label='Below your goals — room to grow.';color='#E08A6E';}
  return {total:withGoal.length,n,missing,pct,label,color,show:withGoal.length>0&&missing===0};
}
function courseAch(c){const g=gradeVal(c.goal),e=gradeVal(c.grade);if(!(g>0)||e==null)return null;return Math.min(100,Math.round(e/g*100));}
function courseName(c){return (c.title||'').trim()||(c.code||'').trim();}
function namedCourses(){return S.courses.filter(c=>courseName(c));}
function todayPlan(){const d=todayShort();return SLOTS.map(slot=>({slot,text:(S.tt[d+'|'+slot]||'').trim(),time:S.ttTime[d+'|'+slot]||''})).filter(p=>p.text||p.time);}
function upcomingExams(){
  const t=todayISO();
  return S.courses.filter(c=>c.exam&&c.exam>=t&&courseName(c)).map(c=>{const [y,m,d]=c.exam.split('-').map(Number),[ty,tm,td]=t.split('-').map(Number);const days=Math.round((new Date(y,m-1,d)-new Date(ty,tm-1,td))/86400000);return {c,days};}).sort((a,b)=>a.days-b.days);
}
/* study time */
function activeStudyMs(now){const a=S.active;if(!a)return 0;now=now||Date.now();return a.studyMs+(a.state==='study'?Math.max(0,now-a.segStart):a.state==='break'?Math.max(0,now-a.breakUntil):0);}
function studiedOn(iso){
  let min=0;S.sessions.forEach(s=>{if(s.day===iso)min+=s.studyMin;});
  if(S.active&&S.active.day===iso)min+=activeStudyMs()/60000;
  return min;
}
function weekDays(){const t=todayISO();return Array.from({length:7},(_,i)=>addDays(t,i-6));}

let LAST_VIEW='',LAST_VIEW_KEY='',LAST_HTML='',LAST_TABS='',LAST_HOME='';
/* Patch el's children to match html, keeping every node that didn't change (no flash, no restarted animations). */
function morph(el,html){const t=document.createElement('template');t.innerHTML=html;morphKids(el,t.content);}
function morphKids(a,b){
  const an=[...a.childNodes],bn=[...b.childNodes];
  bn.forEach((y,i)=>{const x=an[i];
    if(!x)a.appendChild(y);
    else if(x.nodeType===y.nodeType&&x.nodeName===y.nodeName&&(x.nodeType!==1||x.id===y.id))morphNode(x,y);
    else a.replaceChild(y,x);});
  for(let i=bn.length;i<an.length;i++)an[i].remove();
}
function morphNode(x,y){
  if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;return;}
  for(const at of [...x.attributes])if(!y.hasAttribute(at.name))x.removeAttribute(at.name);
  for(const at of y.attributes)if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value);
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(x.nodeName)){if(x!==document.activeElement&&x.value!==y.value)x.value=y.value;if(x.checked!==y.checked)x.checked=y.checked;}
  morphKids(x,y);
}

let TOUR_I=0,tourRaf=0;
function needTour(){if(S.toured||ALARM_MODE)return false;if(hasLocalData()){S.toured=true;save();return false;}return true;}
function renderTour(){
  const st=COACH[TOUR_I];

function placeTour(){
  const st=COACH[TOUR_I],last=TOUR_I===COACH.length-1;
  let el=document.getElementById('tour');
  if(!el){el=document.createElement('div');el.id='tour';document.body.appendChild(el);}
  const tg=st.sel?document.querySelector(st.sel):null;
  const r=tg&&tg.getBoundingClientRect();
  const visible=r&&r.width>0&&r.height>0;
  const pad=6,vw=window.innerWidth,vh=window.innerHeight;
  let spot='',tipStyle='',arrow='';
  if(visible){
    const x=r.left-pad,y=r.top-pad,w=r.width+pad*2,h=r.height+pad*2;
    spot='<div class="co-spot" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;border-radius:'+(tg.id==='fab'||tg.classList.contains('tab')?'22px':'16px')+'"></div>';
    const tipW=Math.min(320,vw-32),below=y+h+190<vh;
    const left=Math.max(16,Math.min(vw-tipW-16,r.left+r.width/2-tipW/2));
    const ax=Math.max(18,Math.min(tipW-18,r.left+r.width/2-left));
    tipStyle='left:'+left+'px;width:'+tipW+'px;'+(below?'top:'+(y+h+14)+'px':'bottom:'+(vh-y+14)+'px');
    arrow='<i class="co-arrow '+(below?'up':'down')+'" style="left:'+(ax-8)+'px"></i>';
  } else {
    spot='<div class="co-dim"></div>';
    const tipW=Math.min(330,vw-32);tipStyle='left:'+((vw-tipW)/2)+'px;width:'+tipW+'px;top:50%;transform:translateY(-50%)';
  }
  el.className='coach';
  el.innerHTML='<div class="co-block"></div>'+spot+'<div class="co-tip" role="dialog" aria-label="'+esc(st.t)+'" style="'+tipStyle+'">'+arrow

}
function closeTour(){cancelAnimationFrame(tourRaf);const el=document.getElementById('tour');if(el)el.remove();}

function render(){

  renderTabs();
  const v={home:vHome,plan:vPlan,progress:vProgress,guide:vGuide,settings:vSettings}[S.activeTab]||vHome;
  const viewKey=S.activeTab+'|'+(S.activeTab==='plan'?S.planTab:'');
  const html=v(),main=$('#main'),cur=main.firstElementChild;

  else{const dir=LAST_VIEW===S.activeTab&&S.activeTab==='plan'?(S.planTab==='courses'?' from-r':' from-l'):'';main.innerHTML='<div class="view enter'+dir+'">'+html+'</div>';}

  if(hk&&LAST_HOME&&hk!==LAST_HOME&&viewKey===LAST_VIEW_KEY){const pane=$('#main .home-pane'),order=['study','alarms','blocks'];

function weeklySubjectRows(){
  const days=weekDays(),per=new Map(),latest=new Map();
  S.sessions.forEach((s,i)=>{if(days.includes(s.day)){per.set(s.course,(per.get(s.course)||0)+s.studyMin);latest.set(s.course,Math.max(latest.get(s.course)||0,s.end||s.start||new Date(s.day+'T00:00').getTime()+i));}});
  if(S.active&&days.includes(S.active.day)){per.set(S.active.course,(per.get(S.active.course)||0)+activeStudyMs()/60000);latest.set(S.active.course,Math.max(latest.get(S.active.course)||0,S.active.start||Date.now()));}
  // Keep only the six most recently studied subjects; preserve study history and totals.
  return Array.from(per).filter(r=>r[1]>=1&&(!S.hiddenProgressSubjects||!S.hiddenProgressSubjects[r[0]]||(latest.get(r[0])||0)>S.hiddenProgressSubjects[r[0]])).sort((a,b)=>(latest.get(b[0])||0)-(latest.get(a[0])||0)||a[0].localeCompare(b[0])).slice(0,6).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));

  const mins=days.map(d=>studiedOn(d)),week=mins.reduce((a,b)=>a+b,0),goal=S.focus.goalMin;
  const max=Math.max(goal,...mins,1);
  const best=Math.max(...mins);const bestIdx=mins.indexOf(best);
  let h='<div class="kpis"><div class="kpi"><b>'+hm(studiedOn(t))+'</b><span>Today</span></div><div class="kpi"><b>'+hm(week)+'</b><span>This week</span></div><div class="kpi"><b>'+st.count+'</b><span>Day streak</span></div></div>';
