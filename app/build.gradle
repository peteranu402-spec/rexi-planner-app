plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
// The repo was re-created, so GitHub's run counter restarted. Offset it so new APKs always install over older ones.
def versionBase = 1000

android {
    namespace 'com.rexi.planner'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rexi.planner'
        minSdk 26
        targetSdk 34
        versionCode versionBase + runNumber
        versionName "1.1." + runNumber
    }

    signingConfigs {
        release {
            storeFile file('../keystore/rexi-release.jks')
            storePassword 'rexiplanner'
            keyAlias 'rexi'
            keyPassword 'rexiplanner'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
