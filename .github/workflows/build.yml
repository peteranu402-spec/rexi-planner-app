name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy the planner web app into the Android app
        run: |
          mkdir -p app/src/main/assets/www
          cp web/index.html web/manifest.json web/icon-192.png app/src/main/assets/www/
          cp -R web/voices app/src/main/assets/www/

      - name: Copy the bundled Roboto font
        run: cp -R web/fonts app/src/main/assets/www/

      - name: Verify alarms, missions, audio and focus policies
        run: |
          set -o pipefail
          {
            node tests/focus-policy.test.cjs
            node tests/voice-alerts.test.cjs
            node tests/bible-translation.test.cjs
            node tests/missions.test.cjs
            node tests/alarm-design.test.cjs
            node tests/native-speech.test.cjs
            node tests/break-expiry.test.cjs
            javac -d /tmp/rexi-policy-tests app/src/main/java/com/rexi/planner/FocusReturnPolicy.java tests/FocusReturnPolicyTest.java
            java -cp /tmp/rexi-policy-tests com.rexi.planner.FocusReturnPolicyTest
            javac -d /tmp/rexi-policy-tests app/src/main/java/com/rexi/planner/VoiceClips.java app/src/main/java/com/rexi/planner/FocusVoicePolicy.java tests/VoicePolicyTest.java
            java -cp /tmp/rexi-policy-tests com.rexi.planner.VoicePolicyTest
          } 2>&1 | tee verification.log

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            verification.log
          if-no-files-found: warn
          retention-days: 14

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "RexiPlanner-1.0.${{ github.run_number }}.apk"

      - name: Package source ZIP
        run: git archive --format=zip --output="rexi-planner-app-source.zip" HEAD

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Rexi Planner 1.0.${{ github.run_number }}
          files: |
            RexiPlanner-1.0.${{ github.run_number }}.apk
            rexi-planner-app-source.zip
          make_latest: true
          body: |
            On your Android phone, tap the .apk file below to download it, then open it to install.
            If Android asks, allow installing apps from this source.

      - name: Save build report
        if: always()
        run: |
          mkdir -p /tmp/report
          cp build.log /tmp/report/build.log 2>/dev/null || echo "No build log" > /tmp/report/build.log
          tail -c 60000 /tmp/report/build.log > /tmp/report/build-tail.log
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > /tmp/report/status.txt
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-logs-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/report/status.txt /tmp/report/build-tail.log .
          git add status.txt build-tail.log
          git commit -m "Build ${{ github.run_number }}: ${{ job.status }}"
          git push -f origin HEAD:build-logs
